<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lil Foots: Big Adventure — Vertical Slice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1a17;
    font-family:'Trebuchet MS',sans-serif; touch-action:none; }
  #game { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ============================================================
// LIL FOOTS: BIG ADVENTURE — VERTICAL SLICE v0.1
// Core loop proof: run, jump, collect Big Tokens,
// dodge Carl's surveillance grid, grab the BIG flagpole + portal.
// 2.5D thick-outline cartoon style, misty PNW woods.
// NOTE: Lily sprite is a PLACEHOLDER drawn in code; official
// art = Bude's unmodified reference images (pending re-send).
// ============================================================

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W=0, H=0, SCALE=1;
function resize(){
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  SCALE = Math.max(W/1280, H/720) * (devicePixelRatio>1?1:1);
  // world zoom so the action reads at phone size
  ZOOM = Math.min(W,1600)/1280 * 1.0;
}
let ZOOM = 1;
addEventListener("resize", resize);

// ---------- WORLD CONSTANTS ----------
const GRAV = 2400, RUNSPD = 460, JUMPVEL = -900, GROUND_Y = 620;
const WORLD_W = 5200;

// ---------- INPUT ----------
const keys = {};
// AUTO-DEMO RIG: screenshot-only mode. Set window.AUTO_DEMO=true before load
// (screenshot wrapper), and Lily self-drives: auto-start, hold right, hop on cadence.
const AUTO = (typeof window!=="undefined" && window.AUTO_DEMO===true);
let autoT = 0;
addEventListener("keydown", e=>{ keys[e.code]=true; if(e.code==="Space"||e.code==="ArrowUp") e.preventDefault(); startGame(); });
addEventListener("keyup", e=>{ keys[e.code]=false; });

// touch buttons (left/right/jump)
const tBtn = { left:{x:0.06,y:0.86,on:false}, right:{x:0.20,y:0.86,on:false}, jump:{x:0.90,y:0.86,on:false} };
let touching = {};
function drawTouch(){ return "ontouchstart" in window || Object.keys(touching).length>0; }
cv.addEventListener("touchstart", tIn, {passive:false});
cv.addEventListener("touchmove", tIn, {passive:false});
cv.addEventListener("touchend", e=>{ touching={}; for(const k in tBtn) tBtn[k].on=false; }, {passive:false});
function tIn(e){
  e.preventDefault(); touching={};
  for(const t of e.touches){
    const x=t.clientX/innerWidth, y=t.clientY/innerHeight;
    if(y>0.68){ // bottom third = controls
      if(x<0.38) touching.left=true;
      else if(x<0.66) touching.jump=true;
      else touching.right=true;
    } else touching.jump=true; // tap upper area = jump too
  }
  for(const k in tBtn) tBtn[k].on=false;
  if(touching.left) tBtn.left.on=true;
  if(touching.right) tBtn.right.on=true;
  if(touching.jump) tBtn.jump.on=true;
  startGame();
}

// ---------- GAME STATE ----------
let mode = "title"; // title | play | flag | portal | win | gate
let camX = 0, tick=0, titleFade=0, regionFade=3, alarm=0;
let tokens=0, tokensTotal=0;
const GATE_NEED = 14;

const player = {
  x:120, y:GROUND_Y, vx:0, vy:0, w:46, h:64,
  onGround:true, face:1, coyote:0, jumpHold:0, hurt:0,
  slide:0, // flagpole slide
};

// ---------- LEVEL DATA ----------
// platforms: [x, y, w, h]
const plats = [
  [0, GROUND_Y, 900, 400],
  [1020, GROUND_Y, 520, 400],
  [1420, GROUND_Y-130, 180, 40], // hop block
  [1720, GROUND_Y, 830, 400],
  [2200, GROUND_Y-150, 170, 40],
  [2460, GROUND_Y-260, 170, 40],
  [2740, GROUND_Y, 960, 400],  // trail cam zone
  [3000, GROUND_Y-140, 170, 40],
  [3820, GROUND_Y, 720, 400],
  [4180, GROUND_Y-120, 200, 40],
  [4720, GROUND_Y, 480, 400], // final hill approach
];
// gaps: between plats (pit = fall = respawn)
// tokens: [x,y]
const tokenPos = [];
[160,300,440,560,700, 830, 1080,1200,1330, 1490, 1760,1900,2030,2150, 2280,2520,2640,
 2800,2920,3060,3180,3300, 3880,4000,4120, 4240,4360, 4800,4920,5040].forEach((x,i)=>{
  // arcs over gaps and straight lines on ground
  tokenPos.push({x, y:GROUND_Y-90, got:false});
});
// trail arcs over the two pits
[935,965,995, 3620,3650,3680].forEach(x=>tokenPos.push({x, y:GROUND_Y-140, got:false}));
tokensTotal = tokenPos.length;

// hounds: patrol ranges
const hounds = [
  {x:1850,y:GROUND_Y,min:1730,max:2380,dir:-1,spd:130,alert:0},
  {x:2900,y:GROUND_Y,min:2760,max:3300,dir:1,spd:120,alert:0},
  {x:4000,y:GROUND_Y,min:3840,max:4400,dir:-1,spd:140,alert:0},
];
// trail cam on a tree (detection cone downward-forward)
const cams = [ {x:3150,y:GROUND_Y-330,flash:0,ang:0} ];
// drone: spotlight sweep over a gap crossing
const drone = { x:3550, y:GROUND_Y-380, t:0, sx:0 };
// snare trap
const snare = { x:2510, y:GROUND_Y-260, sprung:false, timer:0 };
// catcher cameo: Carl runs across background near the flagpole
const carl = { x:4620, y:GROUND_Y-4, dir:1, active:false, phase:0 };

// flagpole + portal
const poleX = 5100, poleTop = GROUND_Y-420;
const portal = { x:4980, y:GROUND_Y-120, r:0 };

function startGame(){
  if(mode==="title"){ mode="play"; regionFade=3; }
  if(mode==="win") location.reload();
}

// ---------- HELPERS ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function outline(fill, lw){ ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=lw||5; ctx.strokeStyle="#12211c"; ctx.stroke(); }
function onPlat(px,py,pw){ // returns plat under feet
  for(const p of plats){
    if(px+pw> p[0] && px < p[0]+p[1+0]===undefined?false: (px+pw>p[0] && px<p[0]+p[2]) && Math.abs(py - p[1])<6) return p;
  }
  return null;
}

// ---------- UPDATE ----------
function update(dt){
  tick++;
  if(regionFade>0) regionFade-=dt;
  if(alarm>0) alarm-=dt;

  if(mode==="title"){ titleFade=Math.min(1,titleFade+dt); return; }
  if(mode==="win") return;

  if(AUTO){ if(mode==="title") mode="play"; if(mode==="win") return;
    autoT += dt;
    if(mode==="play" && autoT%0.85 < dt*1.2){ keys["Space"]=true; setTimeout(()=>keys["Space"]=false,90); }
  }
  if(mode==="play"){
    // input
    let left = keys["ArrowLeft"]||keys["KeyA"]||tBtn.left.on;
    let right = AUTO||keys["ArrowRight"]||keys["KeyD"]||tBtn.right.on;
    let jump = keys["Space"]||keys["ArrowUp"]||keys["KeyW"]||tBtn.jump.on;
    player.vx = (right?RUNSPD:0) - (left?RUNSPD:0);
    if(right) player.face=1; if(left) player.face=-1;

    // jump w/ coyote + hold
    if(player.onGround) player.coyote=0.12; else player.coyote-=dt;
    if(jump && player.coyote>0){ player.vy=JUMPVEL; player.onGround=false; player.coyote=0; player.jumpHold=0.28; }
    if(jump && player.jumpHold>0){ player.vy += -GRAV*dt*0.9; player.jumpHold-=dt; }
    else player.jumpHold=0;
    if(!jump) player.jumpHold=0;

    player.vy += GRAV*dt;
    player.x += player.vx*dt;
    let ny = player.y + player.vy*dt;

    // platform collide (feet)
    player.onGround=false;
    for(const p of plats){
      if(player.x+player.w*0.6 > p[0] && player.x+player.w*0.4 < p[0]+p[2]){
        if(player.vy>=0 && player.y <= p[1]+4 && ny >= p[1]){
          ny = p[1]; player.vy=0; player.onGround=true;
        }
        // head bump on floating plats
        if(player.vy<0 && player.y-player.h > p[1]+p[3]-30 && ny-player.h < p[1]+p[3] && player.x+player.w*0.6>p[0] && player.x+player.w*0.4<p[0]+p[2]){
          // ignore (thin blocks: only land on top for simplicity)
        }
      }
    }
    player.y = ny;

    // pit death
    if(player.y > GROUND_Y+260){
      player.x = 110; player.y = GROUND_Y-40; player.vy=0; player.hurt=1;
      // small token penalty? no — keep it friendly. respawn only.
    }
    // level bounds
    if(player.x<10) player.x=10;

    // tokens
    for(const t of tokenPos){
      if(!t.got && Math.abs(player.x+player.w/2 - t.x)<34 && Math.abs(player.y-player.h/2 - t.y)<44){
        t.got=true; tokens++;
      }
    }

    // hounds
    for(const hd of hounds){
      hd.x += hd.dir * hd.spd * (1 + (hd.alert>0?1.2:0)) * dt;
      if(hd.alert>0) hd.alert-=dt;
      if(hd.x>hd.max){hd.dir=-1;} if(hd.x<hd.min){hd.dir=1;}
      // chase if player close & on ground
      if(Math.abs(hd.x-player.x)<260 && player.onGround) hd.dir = (player.x>hd.x?1:-1);
      // hit
      if(Math.abs(hd.x-(player.x+player.w/2))<44 && Math.abs(hd.y-(player.y-10))<50){
        if(player.y-10 < hd.y-40 && player.vy>200){ // stomped
          player.vy=-520; hd.x = hd.dir>0?hd.min:hd.max; hd.alert=0;
        } else {
          player.x -= 90*Math.sign(player.x-hd.x || 1); player.hurt=0.8;
        }
      }
    }

    // trail cam: cone detection
    for(const c of cams){
      c.ang = Math.sin(tick/40)*0.5;
      c.flash-=dt;
      const dx = player.x - c.x;
      if(dx>0 && dx<420 && c.flash<=0){
        const dy = (player.y-40) - c.y;
        if(dy>120 && dy<340 && Math.abs(c.ang)<0.45){
          c.flash=1.5; alarm=4;
          for(const hd of hounds) if(Math.abs(hd.x-c.x)<800) hd.alert=5;
        }
      }
    }

    // drone spotlight
    drone.t += dt;
    drone.sx = drone.x + Math.sin(drone.t*1.2)*160;
    const spotHit = Math.abs(player.x+20-drone.sx)<60 && player.y>GROUND_Y-80 && player.x>3400 && player.x<3760;
    if(spotHit && alarm<=0){ alarm=3.5; for(const hd of hounds) hd.alert=4; }

    // snare trap
    if(!snare.sprung && Math.abs(player.x+20-snare.x)<26 && player.y>snare.y-40){
      snare.sprung=true; snare.timer=2.2; player.vx=0;
    }
    if(snare.sprung){
      snare.timer-=dt;
      const jump2 = keys["Space"]||keys["ArrowUp"]||keys["KeyW"]||tBtn.jump.on;
      if(jump2 && !jump) snare.timer-=dt*2; // mash to escape faster
      if(snare.timer<=0){ snare.sprung=false; player.vy=-600; }
    }

    // token gate
    if(player.x>4420 && player.x<4500 && tokens<GATE_NEED){
      player.x=4415; mode="gate";
    }
    // flagpole!
    if(player.x+player.w*0.7 > poleX-8 && player.x < poleX+40 && player.y>poleTop){
      mode="flag"; player.slide=0; player.x=poleX-10;
    }
  }

  if(mode==="flag"){
    player.slide += dt*1.4;
    player.y = poleTop + (GROUND_Y-player.y-20)*0 + player.slide*380;
    if(player.y>=GROUND_Y){ player.y=GROUND_Y; mode="portal"; carl.active=true; carl.x=poleX-260; }
  }

  if(mode==="portal"){
    carl.phase+=dt;
    if(carl.active){ carl.x += 200*dt; if(carl.x>poleX+300) carl.active=false; }
    portal.r += dt*2;
    if(player.x < portal.x-10){ player.x += 240*dt; player.face=1; }
    else if(Math.abs(player.x-portal.x)<30){ mode="win"; }
  }

  // camera
  const targetX = Math.max(0, Math.min(player.x - W/(2*ZOOM)/1, WORLD_W - W/ZOOM));
  camX += (targetX-camX)*Math.min(1,dt*6);
  if(mode==="title") camX=0;
}

// ---------- DRAW ----------
function drawBG(){
  // sky gradient (misty golden-hour PNW)
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#2e4a44"); g.addColorStop(0.45,"#4a7a6b"); g.addColorStop(0.8,"#9fc8ad"); g.addColorStop(1,"#e8d9a0");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // far cedars (parallax 0.15)
  drawTreeLine(0.15, "#22423a", 0.55, GROUND_Y*ZOOM*0.55);
  drawTreeLine(0.35, "#1b3830", 0.75, GROUND_Y*ZOOM*0.7);
  // fog bands
  ctx.globalAlpha=0.18; ctx.fillStyle="#cfe8d8";
  ctx.fillRect(0,GROUND_Y*ZOOM*0.35,W,H*0.1);
  ctx.fillRect(0,GROUND_Y*ZOOM*0.55,W,H*0.08);
  ctx.globalAlpha=1;
}
function drawTreeLine(px, colr, hgt, base){
  const off = -camX*px*ZOOM;
  ctx.fillStyle=colr;
  for(let i=0;i<26;i++){
    const bx = ((i*240+off)%(W+400))+(i%2?80:0);
    const th = H*hgt*(0.8+((i*37)%40)/60);
    // cedar triangle stack
    for(let l=0;l<3;l++){
      ctx.beginPath();
      ctx.moveTo(bx, base-th + th*0.34*l);
      ctx.lineTo(bx-46+hgt*20, base-th+th*0.34*l+th*0.4);
      ctx.lineTo(bx+46-hgt*20, base-th+th*0.34*l+th*0.4);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawWorld(){
  ctx.save();
  ctx.translate(-camX*ZOOM,0); ctx.scale(ZOOM,ZOOM);

  // ground platforms
  for(const p of plats){
    // grass top
    ctx.beginPath(); rr(p[0],p[1],p[2],p[3],18);
    outline("#3f6b4f",5);
    // dirt texture dots
    ctx.fillStyle="#2c4d3a";
    for(let i=0;i<p[2]/70;i++){ ctx.beginPath(); ctx.ellipse(p[0]+35+i*70, p[1]+40+((i*53)%80), 22,10,0,0,7); ctx.fill(); }
    // grass tufts
    ctx.fillStyle="#5d9a6d";
    for(let i=0;i<p[2]/90;i++){ ctx.beginPath(); ctx.ellipse(p[0]+45+i*90, p[1]+6, 26,8,0,0,7); ctx.fill(); }
    // foreground trees on long plats
    if(p[2]>600){ for(let i=0;i<Math.floor(p[2]/300);i++){
      const tx=p[0]+90+i*300, ty=p[1];
      ctx.fillStyle="#5a4632"; ctx.fillRect(tx-7,ty-150,14,150);
      for(let l=0;l<3;l++){ ctx.beginPath(); ctx.moveTo(tx,ty-250+l*55); ctx.lineTo(tx-40,ty-190+l*55); ctx.lineTo(tx+40,ty-190+l*55); ctx.closePath();
        ctx.fillStyle="#2f6b52"; ctx.fill(); }
    }}
  }

  // footprint decorations (logos/spots ONLY — not mechanics)
  ctx.fillStyle="rgba(20,40,30,0.55)";
  const fp=[[210],[380],[560],[1130],[1290],[1830],[2050],[2860],[3350],[3900],[4450],[4830]];
  for(const f of fp){ ctx.beginPath(); ctx.ellipse(f[0],GROUND_Y-8,20,12,0.2,0,7); ctx.fill(); }

  // Big Tokens: gold coins with BIG wordmark
  for(const t of tokenPos){
    if(t.got) continue;
    const bob = Math.sin(tick/20 + t.x/40)*5;
    ctx.save(); ctx.translate(t.x, t.y+bob);
    ctx.beginPath(); ctx.arc(0,0,20,0,7); outline("#f2c94c",5);
    ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fillStyle="#141c1f"; ctx.fill();
    ctx.fillStyle="#39e6a0"; ctx.font="bold 15px 'Arial Black',sans-serif"; ctx.textAlign="center";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=8; ctx.fillText("BIG",0,5.5); ctx.shadowBlur=0;
    ctx.restore();
  }

  // snare trap
  if(!snare.sprung){
    ctx.strokeStyle="#8a6a3c"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.ellipse(snare.x, snare.y-6, 26,10,0,0,7); ctx.stroke();
    ctx.strokeStyle="#c9a35f"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(snare.x, snare.y-6, 16,6,0,0,7); ctx.stroke();
  } else {
    ctx.strokeStyle="#c9a35f"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(snare.x, snare.y-40, 24, 0, 7); ctx.stroke();
  }

  // hounds
  for(const hd of hounds){
    ctx.save(); ctx.translate(hd.x, hd.y);
    ctx.scale(hd.dir,1);
    // body
    ctx.beginPath(); ctx.ellipse(0,-26,34,20,0,0,7); outline(hd.alert>0?"#b56a4a":"#a97c50",5);
    // head
    ctx.beginPath(); ctx.arc(30,-38,15,0,7); outline(hd.alert>0?"#b56a4a":"#a97c50",5);
    // ear
    ctx.beginPath(); ctx.ellipse(26,-52,7,12,0.3,0,7); outline("#7a5433",4);
    // legs
    const lg = Math.sin(tick/6)* (hd.alert>0?8:5);
    ctx.lineWidth=7; ctx.strokeStyle="#12211c";
    ctx.beginPath(); ctx.moveTo(-16,-14); ctx.lineTo(-14+lg,0); ctx.moveTo(14,-14); ctx.lineTo(16-lg,0); ctx.stroke();
    // alert badge
    if(hd.alert>0){ ctx.fillStyle="#e23b2e"; ctx.beginPath(); ctx.moveTo(30,-62); ctx.lineTo(40,-74); ctx.lineTo(46,-60); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

  // trail camera (tree-mounted, detection cone)
  for(const c of cams){
    ctx.fillStyle="#4a3a2a"; ctx.fillRect(c.x-6, c.y, 12, 120); // trunk stub
    ctx.beginPath(); ctx.ellipse(c.x-40, c.y+130, 55, 26, 0.3,0,7); ctx.fillStyle="#2f6b52"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+40, c.y+130, 55, 26, -0.3,0,7); ctx.fill();
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.beginPath(); rr(-14,-12,34,26,6); outline("#3d4f47",5);
    ctx.beginPath(); ctx.arc(16,2,7,0,7); ctx.fillStyle= c.flash>0 ? "#ff4030" : "#39e6a0"; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle="#12211c"; ctx.stroke();
    // detection cone
    ctx.globalAlpha = c.flash>0 ? 0.35 : 0.12;
    ctx.fillStyle = c.flash>0 ? "#ff4030" : "#39e6a0";
    ctx.beginPath(); ctx.moveTo(16,2);
    ctx.lineTo(190, 120+Math.tan(c.ang)*90); ctx.lineTo(190, 330+Math.tan(c.ang)*90);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.restore();
    if(c.flash>0){ // red flash frame alert
      ctx.globalAlpha=0.5; ctx.fillStyle="#ff4030";
      ctx.fillRect(c.x-60, c.y+180, 120, 8); ctx.globalAlpha=1;
    }
  }

  // drone + spotlight
  {
    ctx.save(); ctx.translate(drone.sx, drone.y);
    ctx.beginPath(); ctx.ellipse(0,0,22,9,0,0,7); outline("#55645c",4);
    ctx.fillStyle="#55645c";
    const pr = Math.sin(tick/2)*8;
    ctx.fillRect(-26,-8+pr*0.3, 12,3); ctx.fillRect(14,-8-pr*0.3, 12,3);
    ctx.beginPath(); ctx.arc(0,8,6,0,7); ctx.fillStyle= alarm>0 ? "#ff4030":"#39e6a0"; ctx.fill();
    ctx.restore();
    // spotlight beam
    ctx.globalAlpha= alarm>0?0.3:0.16;
    ctx.fillStyle= alarm>0 ? "#ff6a50":"#bfe8c8";
    ctx.beginPath(); ctx.moveTo(drone.sx-10,drone.y+10); ctx.lineTo(drone.sx-70,GROUND_Y); ctx.lineTo(drone.sx+70,GROUND_Y); ctx.lineTo(drone.sx+10,drone.y+10); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    // rope line up
    ctx.strokeStyle="rgba(30,50,40,0.4)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(drone.x,0); ctx.lineTo(drone.sx,drone.y); ctx.stroke();
  }

  // token gate
  {
    ctx.fillStyle="#223a30";
    ctx.fillRect(4450, GROUND_Y-150, 14, 150); ctx.fillRect(4610, GROUND_Y-150, 14, 150);
    ctx.fillStyle="#39e6a0"; ctx.font="bold 26px 'Arial Black',sans-serif"; ctx.textAlign="center";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=10;
    ctx.fillText(tokens+"/"+GATE_NEED, 4537, GROUND_Y-70);
    ctx.shadowBlur=0;
    if(tokens<GATE_NEED){
      ctx.strokeStyle="rgba(255,80,60,0.7)"; ctx.lineWidth=4; ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(4537, GROUND_Y-140); ctx.lineTo(4537, GROUND_Y); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // flagpole + flag (BIG Network wordmark, NO paw prints)
  {
    ctx.fillStyle="#7a5f3e"; ctx.fillRect(poleX-7, poleTop, 14, GROUND_Y-poleTop);
    ctx.beginPath(); ctx.arc(poleX, poleTop-6, 9,0,7); outline("#f2c94c",4);
    // flag: dark with glowing BIG wordmark
    const fw=150, fh=84, wave=Math.sin(tick/12)*7;
    ctx.beginPath(); ctx.moveTo(poleX+7, poleTop+2);
    ctx.quadraticCurveTo(poleX+7+fw/2, poleTop+2+wave, poleX+7+fw, poleTop+14);
    ctx.lineTo(poleX+7+fw, poleTop+14+fh-14);
    ctx.quadraticCurveTo(poleX+7+fw/2, poleTop+2+fh-14+wave, poleX+7, poleTop+2+fh);
    ctx.closePath(); outline("#141c1f",5);
    ctx.save();
    ctx.clip();
    ctx.fillStyle="#39e6a0"; ctx.font="bold 44px 'Space Grotesk','Arial Black',sans-serif";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=14;
    ctx.fillText("BIG", poleX+16, poleTop+62);
    ctx.shadowBlur=0; ctx.restore();
    // stone arch portal
    {
      const px=portal.x, py=portal.y;
      ctx.beginPath(); ctx.arc(px-62, py, 22,0,7); outline("#6d7a72",5);
      ctx.beginPath(); ctx.arc(px+62, py, 22,0,7); outline("#6d7a72",5);
      ctx.beginPath(); rr(px-90, py-118, 180, 26, 12); outline("#6d7a72",5);
      ctx.beginPath(); rr(px-84, py-108, 168, 20, 10); ctx.fillStyle="#7f8c83"; ctx.fill();
      // swirl
      const grd = ctx.createRadialGradient(px,py-50,6,px,py-50,64);
      grd.addColorStop(0,"#eaffd8"); grd.addColorStop(0.5,"#39e6a0"); grd.addColorStop(1,"#0f4a34");
      ctx.beginPath(); ctx.ellipse(px, py-50, 56, 62, 0,0,7); ctx.fillStyle=grd; ctx.fill();
      ctx.lineWidth=5; ctx.strokeStyle="#12211c"; ctx.stroke();
      for(let s=0;s<3;s++){
        ctx.globalAlpha=0.5; ctx.strokeStyle="#eaffd8"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px, py-50, 18+s*14 + (portal.r*10)%14, tick*0.02, tick*0.02+4); ctx.stroke(); ctx.globalAlpha=1;
      }
    }
  }

  // catcher cameo: Carl runs across near the flagpole
  if(carl.active || mode==="portal" || mode==="win"){
    ctx.save(); ctx.translate(carl.x, carl.y); ctx.scale(carl.dir,1);
    // khaki body
    ctx.beginPath(); rr(-16,-86, 34, 52, 8); outline("#b8a15c",5);
    // head
    ctx.beginPath(); ctx.arc(0,-102, 16,0,7); outline("#e0b58a",5);
    // beard stubble + grin
    ctx.fillStyle="#8a6a4a"; ctx.beginPath(); ctx.arc(0,-96, 9,0,Math.PI); ctx.fill();
    // hat brim + crown
    ctx.beginPath(); ctx.ellipse(0,-112, 30, 7,0,0,7); outline("#6d5a2e",4);
    ctx.beginPath(); rr(-13,-130,26,20,6); outline("#6d5a2e",4);
    // giant butterfly net on shoulder
    ctx.strokeStyle="#7a5f3e"; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(12,-80); ctx.lineTo(46,-128); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(50,-138, 20,15, 0.4,0,7); outline("#cfe8d8",4);
    // legs
    const lg2=Math.sin(tick/4)*9;
    ctx.lineWidth=8; ctx.strokeStyle="#12211c";
    ctx.beginPath(); ctx.moveTo(-6,-34); ctx.lineTo(-6+lg2,0); ctx.moveTo(8,-34); ctx.lineTo(8-lg2,0); ctx.stroke();
    ctx.restore();
  }

  // PLAYER: Lily (PLACEHOLDER — official art pending Bude's ref)
  {
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y);
    ctx.scale(player.face,1);
    const squash = player.onGround && Math.abs(player.vx)>10 ? 1+Math.sin(tick/8)*0.03 : 1;
    ctx.scale(1, squash);
    const bob2 = player.onGround? Math.abs(Math.sin(tick/9))*3 : 0;
    ctx.translate(0,bob2*0);
    // hurt flash
    if(player.hurt>0){ ctx.globalAlpha = (Math.sin(tick*1.5)>0?0.4:1); player.hurt-=0.02; }
    // tail
    ctx.beginPath(); ctx.ellipse(-24,-22, 12,8, 0.5,0,7); outline("#7ec850",4);
    // body
    ctx.beginPath(); rr(-19,-58, 38, 40, 14); outline("#7ec850",5);
    // legs
    const lp = player.onGround? Math.sin(tick/(Math.abs(player.vx)>10?5:14))*8 : 6;
    ctx.lineWidth=8; ctx.strokeStyle="#12211c";
    ctx.beginPath(); ctx.moveTo(-8,-20); ctx.lineTo(-8-lp,0); ctx.moveTo(9,-20); ctx.lineTo(9+lp,0); ctx.stroke();
    // arms
    ctx.beginPath(); ctx.moveTo(-15,-48); ctx.lineTo(-27,-36+(player.onGround?0:-12)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16,-48); ctx.lineTo(28,-36+(player.onGround?0:-16)); ctx.stroke();
    // head
    ctx.beginPath(); ctx.arc(0,-72, 22,0,7); outline("#7ec850",5);
    // fur tuft
    ctx.beginPath(); ctx.moveTo(-4,-93); ctx.lineTo(2,-102); ctx.lineTo(8,-92); ctx.closePath(); outline("#7ec850",4);
    // LIGHT BLUE BOW (canon)
    ctx.beginPath(); ctx.moveTo(-14,-90); ctx.lineTo(-24,-100); ctx.lineTo(-22,-86); ctx.closePath();
    ctx.moveTo(-14,-90); ctx.lineTo(-24,-80); ctx.lineTo(-22,-96); ctx.closePath(); outline("#9ad6f0",4);
    ctx.beginPath(); ctx.arc(-14,-90,4,0,7); outline("#9ad6f0",3);
    // POLARIZED SHADES (canon): rainbow-lens glasses
    ctx.beginPath(); rr(-16,-76, 32, 12, 5);
    ctx.fillStyle="#141c1f"; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#12211c"; ctx.stroke();
    const lg2 = ctx.createLinearGradient(-14,-76, 14,-64);
    lg2.addColorStop(0,"#e8599a"); lg2.addColorStop(0.4,"#ffd24a"); lg2.addColorStop(0.8,"#5ac8fa");
    ctx.fillStyle=lg2; ctx.beginPath(); rr(-13,-75, 30, 10, 4); ctx.fill();
    // smile
    ctx.strokeStyle="#12211c"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-64, 8, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawHUD(){
  if(mode==="title"){
    ctx.fillStyle="rgba(10,20,16,"+0.35*titleFade+")"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#eaffd8"; ctx.font="bold "+Math.round(64*ZOOM)+"px 'Space Grotesk','Arial Black',sans-serif";
    ctx.shadowColor="#0f4a34"; ctx.shadowBlur=0;
    ctx.fillText("LIL FOOTS", W/2, H*0.34);
    ctx.fillStyle="#f2c94c"; ctx.fillText("BIG ADVENTURE", W/2, H*0.34+70*ZOOM);
    ctx.shadowBlur=0;
    ctx.fillStyle="#cfe8d8"; ctx.font="bold "+Math.round(20*ZOOM)+"px Trebuchet MS";
    ctx.globalAlpha = Math.sin(tick/20)>0 ? 1:0.4;
    ctx.fillText("TAP or press SPACE to start", W/2, H*0.62);
    ctx.globalAlpha=1;
    ctx.font="14px Trebuchet MS"; ctx.fillStyle="#8fb8a4";
    ctx.fillText("Vertical Slice v0.1 — one level proof", W/2, H*0.92);
    return;
  }
  // token counter
  ctx.save(); ctx.scale(ZOOM,ZOOM);
  ctx.beginPath(); ctx.arc(40,40,22,0,7); outline("#f2c94c",5);
  ctx.beginPath(); ctx.arc(40,40,14,0,7); ctx.fillStyle="#141c1f"; ctx.fill();
  ctx.fillStyle="#39e6a0"; ctx.font="bold 13px 'Arial Black'"; ctx.textAlign="center";
  ctx.fillText("BIG",40,44);
  ctx.fillStyle="#eaffd8"; ctx.font="bold 24px 'Space Grotesk','Arial Black'"; ctx.textAlign="left";
  ctx.fillText(tokens+" / "+tokensTotal, 72, 48);
  // alarm badge
  if(alarm>0){
    ctx.fillStyle= Math.sin(tick*1.4)>0 ? "#e23b2e":"#a52a20";
    ctx.font="bold 15px 'Arial Black'"; ctx.textAlign="center";
    ctx.fillText("SPOTTED! HOUNDS ALERTED", 350, 42);
  }
  ctx.restore();

  // region title card
  if(regionFade>0){
    ctx.globalAlpha=Math.min(1,regionFade);
    ctx.textAlign="center"; ctx.fillStyle="#eaffd8";
    ctx.font="bold "+Math.round(46*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.fillText("THE MISTY HOLLOW", W/2, H*0.3);
    ctx.font="italic "+Math.round(18*ZOOM)+"px Georgia";
    ctx.fillText("run, jump, reach the BIG flag", W/2, H*0.3+34*ZOOM);
    ctx.globalAlpha=1;
  }

  if(mode==="gate"){
    ctx.textAlign="center"; ctx.fillStyle="#eaffd8";
    ctx.font="bold "+Math.round(26*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.globalAlpha=0.9;
    ctx.fillText("BIG TOKEN GATE — need "+GATE_NEED+" tokens to pass", W/2, H*0.3);
    ctx.fillText("you have "+tokens, W/2, H*0.3+34*ZOOM);
    ctx.globalAlpha=1;
  }

  if(mode==="win"){
    ctx.fillStyle="rgba(10,20,16,0.55)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#f2c94c"; ctx.font="bold "+Math.round(52*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.fillText("LEVEL CLEAR!", W/2, H*0.4);
    ctx.fillStyle="#eaffd8"; ctx.font="bold "+Math.round(22*ZOOM)+"px Trebuchet MS";
    ctx.fillText(tokens+" Big Tokens collected — portal to Level 2", W/2, H*0.4+44*ZOOM);
    ctx.globalAlpha=Math.sin(tick/20)>0?1:0.4;
    ctx.fillText("tap to replay", W/2, H*0.62); ctx.globalAlpha=1;
  }

  // touch controls hint
  if(drawTouch() && mode==="play"){
    ctx.globalAlpha=0.25;
    for(const k in tBtn){
      const b=tBtn[k];
      ctx.beginPath(); ctx.arc(b.x*W, b.y*H, 52, 0,7);
      ctx.fillStyle= b.on? "#39e6a0":"#eaffd8"; ctx.fill();
    }
    ctx.globalAlpha=0.8; ctx.fillStyle="#12211c"; ctx.textAlign="center"; ctx.font="bold 16px Trebuchet MS";
    ctx.fillText("◀", tBtn.left.x*W, tBtn.left.y*H+6);
    ctx.fillText("▶", tBtn.right.x*W, tBtn.right.y*H+6);
    ctx.fillText("JUMP", tBtn.jump.x*W, tBtn.jump.y*H+6);
    ctx.globalAlpha=1;
  }
}

// ---------- MAIN LOOP ----------
let last=0;
function frame(ts){
  const dt = Math.min(0.033, (ts-last)/1000 || 0.016); last=ts;
  update(dt);
  ctx.setTransform(1,0,0,1,0,0);
  drawBG();
  drawWorld();
  drawHUD();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
