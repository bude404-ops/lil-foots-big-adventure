let castSel = 0;
addEventListener("keydown", e=>{ keys[e.code]=true; initAudio(); if(e.code==="Space"||e.code==="ArrowUp") e.preventDefault();
  if(mode==="over"){ if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowUp") restartLevel(); return; }
  if(mode==="title"){
    if(e.code==="ArrowLeft"){ castSel=(castSel+CAST.length-1)%CAST.length; SFX.select(); return; }
    if(e.code==="ArrowRight"){ castSel=(castSel+1)%CAST.length; SFX.select(); return; }
    const n = ["Digit1","Digit2","Digit3","Digit4"].indexOf(e.code);
    if(n>=0 && CAST[n].img){ castSel=n; SFX.select(); return; }
  }
  startGame(); });

const tBtn = { left:{x:0.09,y:0.85,on:false}, right:{x:0.24,y:0.85,on:false}, jump:{x:0.87,y:0.85,on:false} };
let touching = {};
function drawTouch(){ return "ontouchstart" in window || Object.keys(touching).length>0; }
cv.addEventListener("touchstart", tIn, {passive:false});
cv.addEventListener("touchmove", tIn, {passive:false});
cv.addEventListener("touchend", e=>{ touching={}; for(const k in tBtn) tBtn[k].on=false; }, {passive:false});
function castChipRects(){
  const playable = CAST.map((c,i)=>({c,i})).filter(o=>o.c.img);
  const chipH=170*ZOOM, chipW=130*ZOOM, gap=30*ZOOM, rowY=H*0.40;
  const totalW = playable.length*(chipW+gap)-gap, sx=(W-totalW)/2;
  return playable.map((o,k)=>({i:o.i, x:sx+k*(chipW+gap), y:rowY, w:chipW, h:chipH}));
}
cv.addEventListener("mousedown", e=>{
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)*(W/r.width), py=(e.clientY-r.top)*(H/r.height);
  if(Math.hypot(px-(W-52),py-52)<36){ toggleMute(); }
});
function tIn(e){
  e.preventDefault(); touching={}; initAudio();
  for(const t of e.touches){
    const x=t.clientX/innerWidth, y=t.clientY/innerHeight;
    const px=x*W, py=y*H;
    if(Math.hypot(px-(W-52),py-52)<42){ toggleMute(); continue; }
    if(mode==="over"){ restartLevel(); return; }
    if(mode==="title"){
      const rects=castChipRects();
      let hit=false;
      for(const rc of rects){
        if(px>=rc.x&&px<=rc.x+rc.w&&py>=rc.y&&py<=rc.y+rc.h){ castSel=rc.i; SFX.select(); hit=true; break; }
      }
      if(!hit) startGame();
      return;
    }
    if(y>0.62){ // control deck: arrows bottom-left, JUMP bottom-right (thumb reach)
      if(x<0.165) touching.left=true;
      else if(x<0.33) touching.right=true;
      else touching.jump=true;
    } else touching.jump=true; // tap upper area = jump too
  }
  for(const k in tBtn) tBtn[k].on=false;
  if(touching.left) tBtn.left.on=true;
  if(touching.right) tBtn.right.on=true;
  if(touching.jump) tBtn.jump.on=true;
  startGame();
}

// ---------- AUDIO (WebAudio synth: SFX + forest music loop) ----------
const AU = {ctx:null, master:null, on:true, musicTimer:null};
function initAudio(){
  if(AU.ctx || !AU.on){ if(AU.ctx&&AU.ctx.state==="suspended") AU.ctx.resume(); return; }
  try{ AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  AU.master = AU.ctx.createGain(); AU.master.gain.value=0.5; AU.master.connect(AU.ctx.destination);
  startMusic();
}
function tone(f0,f1,dur,type,vol,when){
  if(!AU.ctx||!AU.on) return;
  const t = when||AU.ctx.currentTime;
  const o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+0.03);
}
function noiseS(dur,vol,fq){
  if(!AU.ctx||!AU.on) return;
  const t=AU.ctx.currentTime, n=Math.floor(AU.ctx.sampleRate*dur);
  const b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AU.ctx.createBufferSource(); src.buffer=b;
  const f=AU.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=fq||900;
  const g=AU.ctx.createGain(); g.gain.value=vol||0.3;
  src.connect(f); f.connect(g); g.connect(AU.master); src.start(t);
}
const SFX = {
  jump:   ()=> tone(320,660,0.14,"square",0.14),
  coin:   ()=> { if(!AU.ctx||!AU.on) return; const t=AU.ctx.currentTime; tone(988,0,0.07,"sine",0.18,t); tone(1319,0,0.18,"sine",0.16,t+0.07); },
  stomp:  ()=> { tone(220,60,0.16,"triangle",0.28); noiseS(0.12,0.18,700); },
  hurt:   ()=> tone(300,110,0.25,"sawtooth",0.16),
  snitch: ()=> { noiseS(0.05,0.3,4000); if(AU.ctx) tone(1500,900,0.08,"square",0.1,AU.ctx.currentTime+0.08); },
  snare:  ()=> tone(150,80,0.2,"triangle",0.28),
  select: ()=> tone(660,880,0.08,"square",0.1),
  flag:   ()=> tone(900,280,0.7,"triangle",0.14),
  portal: ()=> { tone(200,900,0.5,"sine",0.16); noiseS(0.5,0.12,600); },
  win:    ()=> { if(!AU.ctx) return; const t=AU.ctx.currentTime; [523,659,784,1047].forEach((f,i)=>tone(f,0,0.22,"square",0.14,t+i*0.13)); },
  gate:   ()=> tone(180,140,0.3,"sawtooth",0.16),
  camSmash:()=> { noiseS(0.18,0.32,2500); tone(700,120,0.15,"square",0.2); },
  droneDie:()=> { tone(420,50,0.5,"sawtooth",0.2); noiseS(0.25,0.18,1200); },
  die:    ()=> { tone(400,90,0.4,"triangle",0.22); },
  gameOver:()=> { if(!AU.ctx) return; const t=AU.ctx.currentTime; [392,330,262,196].forEach((f,i)=>tone(f,0,0.3,"triangle",0.16,t+i*0.22)); },
};
// forest music loop (C-pentatonic, bass + lead)
const BASS=[131,131,98,98,110,110,87,87];
const LEAD=[523,587,659,784,659,587,523,392,440,523,659,523,587,523,440,0];
function startMusic(){
  if(AU.musicTimer||!AU.ctx) return;
  const SPB=0.24; // 8th notes @ 125bpm
  const playBar=()=>{
    if(!AU.ctx||!AU.on) return;
    const t=AU.ctx.currentTime+0.05;
    for(let i=0;i<8;i++) tone(BASS[i],0,0.20,"triangle",0.09,t+i*SPB*2);
    for(let i=0;i<16;i++) if(LEAD[i]) tone(LEAD[i],0,0.15,"square",0.035,t+i*SPB);
  };
  playBar();
  AU.musicTimer = setInterval(playBar, SPB*16*1000);
}
function toggleMute(){
  AU.on=!AU.on;
  if(AU.master) AU.master.gain.value = AU.on?0.5:0;
  if(AU.on && AU.ctx && AU.ctx.state==="suspended") AU.ctx.resume();
}

// catcher cameo: Carl runs across background near the flagpole
const carl = { x:4620, y:GROUND_Y-4, dir:1, active:false, phase:0, emerge:0, lunge:0 };
hounds.forEach(h=>{ h.homeX=h.x; h.homeDir=h.dir; });
const poofs = []; // stomp dust
let enterT=0, enterFrom={x:0,y:0}; // portal suck-in
let lives=3; // 3 lives, lose one per death, 0 = restart at the beginning
const checkpoints=[{x:110},{x:1180},{x:3450},{x:3830}]; // respawn points (post at all but the start) — safe ground, runway before each obstacle

// flagpole + portal
const poleX = 5100, poleTop = GROUND_Y-420;
const portal = { x:poleX+230, y:GROUND_Y-120, r:0 }; // RIGHT of the flag (Bude: escape runs forward)
const carlTreeX = poleX-260; // the cedar Carl bursts from — the escape reads as a real chase

let houndSpawnCd=0; // alert-pack cooldown — one pack per detection, not a flood
function callHounds(cx){
  if(houndSpawnCd>0) return;
  if(hounds.filter(h=>!h.dead).length>=6) return;
  houndSpawnCd=9;
  for(let i=0;i<2;i++)
    hounds.push({x: cx+(i?640:-640), y:GROUND_Y, dir:i?-1:1, spd:155+i*25,
                 min:cx-620, max:cx+620, alert:6, dead:false, spawned:true});
}
function resetEnemies(){ // death = enemies respawn (classic)
  for(let i=hounds.length-1;i>=0;i--) if(hounds[i].spawned) hounds.splice(i,1); // alert packs disperse
  for(const hd of hounds){ hd.dead=false; hd.x=hd.homeX; hd.dir=hd.homeDir; hd.alert=0; }
  for(const c of cams){ c.dead=false; c.flash=0; }
  drone.dead=false; drone.crashed=false; drone.fallT=0; drone.fy=drone.y; drone.fx=drone.x; drone.t=0; drone.sx=drone.x;
  snare.sprung=false; snare.timer=0;
  alarm=0;
}
function respawnAtCheckpoint(){
  let cp=checkpoints[0];
  for(const c of checkpoints) if(player.maxX >= c.x-10) cp=c;
  player.x=cp.x; player.y=GROUND_Y-40; player.vy=0; player.vx=0; player.hurt=1.2; player.safe=1.6;
  camX=Math.max(0, cp.x-400);
  resetEnemies();
}
function die(){
  lives--; SFX.die();
  if(lives<=0){ mode="over"; SFX.gameOver(); return; }
  respawnAtCheckpoint();
}
function restartLevel(){ // out of lives = back to the beginning
  lives=3; tokens=0;
  for(const t of tokenPos) t.got=false;
  player.x=110; player.y=GROUND_Y-40; player.vy=0; player.vx=0; player.hurt=0; player.maxX=110; player.face=1;
  resetEnemies();
  camX=0; regionFade=0;
  mode="play";
}
function startGame(){ initAudio();
  if(mode==="title"){ mode="play"; regionFade=3; }
  if(mode==="win") location.reload();
}

function onPlat(px,py,pw){ // returns plat under feet
  for(const p of plats){
    if(px+pw> p[0] && px < p[0]+p[1+0]===undefined?false: (px+pw>p[0] && px<p[0]+p[2]) && Math.abs(py - p[1])<6) return p;
  }
  return null;
}

// ---------- UPDATE ----------
function update(dt){
  tick++;
  if(regionFade>0) regionFade-=dt;
  if(alarm>0) alarm-=dt;
  if(houndSpawnCd>0) houndSpawnCd-=dt;
  if(player.safe>0) player.safe-=dt;
  for(let i=poofs.length-1;i>=0;i--){ poofs[i].t-=dt; if(poofs[i].t<=0) poofs.splice(i,1); }

  if(mode==="title"){ titleFade=Math.min(1,titleFade+dt); if(AUTO){ mode="play"; regionFade=3; } else return; }
  if(mode==="win") return;

  if(AUTO){ if(mode==="win") return;
    autoT += dt;
    if(mode==="play" && autoT%0.85 < dt*1.2){ keys["Space"]=true; setTimeout(()=>keys["Space"]=false,90); }
  }
  if(mode==="play"){
    // input
    let left = keys["ArrowLeft"]||keys["KeyA"]||tBtn.left.on;
    let right = AUTO||keys["ArrowRight"]||keys["KeyD"]||tBtn.right.on;
    let jump = keys["Space"]||keys["ArrowUp"]||keys["KeyW"]||tBtn.jump.on;
    // smooth accel/decel so movement FLOWS instead of snapping
    const target = (right?RUNSPD:0) - (left?RUNSPD:0);
    const accel = player.onGround? 3400 : 2100;
    if(target > player.vx) player.vx = Math.min(target, player.vx + accel*dt);
    else if(target < player.vx) player.vx = Math.max(target, player.vx - accel*dt);
    if(right && !left) player.face=1; if(left && !right) player.face=-1;

    // jump: coyote + BUFFER (early press still fires on landing) + hold for height
    if(jump && !player.jumpWas) player.jumpBuf=0.14; // fresh press
    if(!jump) player.jumpBuf=0;
    player.jumpWas=jump;
    if(player.onGround) player.coyote=0.12; else player.coyote-=dt;
    if(player.jumpBuf>0 && (player.onGround||player.coyote>0)){
      player.vy=JUMPVEL; player.onGround=false; player.coyote=0; player.jumpBuf=0; player.jumpHold=0.28; SFX.jump();
    }
    if(jump && player.jumpHold>0){ player.vy += -GRAV*dt*0.9; player.jumpHold-=dt; }
    else player.jumpHold=0;
    if(!jump) player.jumpHold=0;

    player.vy += GRAV*dt;
    player.x += player.vx*dt;
    player.py = player.y; // prev pos for swept stomp
    let ny = player.y + player.vy*dt;

    // platform collide (feet)
    player.onGround=false;
    for(const p of plats){
      if(player.x+player.w*0.6 > p[0] && player.x+player.w*0.4 < p[0]+p[2]){
        if(player.vy>=0 && player.y <= p[1]+4 && ny >= p[1]){
          ny = p[1]; player.vy=0; player.onGround=true;
        }
        // head bump on floating plats
        if(player.vy<0 && player.y-player.h > p[1]+p[3]-30 && ny-player.h < p[1]+p[3] && player.x+player.w*0.6>p[0] && player.x+player.w*0.4<p[0]+p[2]){
          // ignore (thin blocks: only land on top for simplicity)
        }
      }
    }
    player.y = ny;

    // pit death — costs a life, respawn at last checkpoint
    if(player.y > GROUND_Y+260){ die(); }
    // checkpoint + progress tracking
    player.maxX = Math.max(player.maxX, player.x);
    // level bounds
    if(player.x<10) player.x=10;

    // tokens
    for(const t of tokenPos){
      if(!t.got && Math.abs(player.x+player.w/2 - t.x)<34 && Math.abs(player.y-player.h/2 - t.y)<44){
        t.got=true; tokens++; SFX.coin();
      }
    }

    // hounds — DEAD STAYS DEAD (stomped = gone for the run)
    for(const hd of hounds){
      if(hd.dead) continue;
      hd.x += hd.dir * hd.spd * (1 + (hd.alert>0?1.2:0)) * dt;
      if(hd.alert>0) hd.alert-=dt;
      if(hd.x>hd.max){hd.dir=-1;} if(hd.x<hd.min){hd.dir=1;}
      // chase if player close & on ground — but hounds stay leashed near their patrol zone
      const inLeash = hd.x >= hd.min-200 && hd.x <= hd.max+200;
      if(inLeash && Math.abs(hd.x-player.x)<260 && player.onGround) hd.dir = (player.x>hd.x?1:-1);
      else if(hd.x < hd.min-200) hd.dir = 1;
      else if(hd.x > hd.max+200) hd.dir = -1;
      // hit — stomp registers ONLY when feet actually reach the hound's head
      if(Math.abs(hd.x-(player.x+player.w/2))<38){
        const feetNow = player.y-10, feetPrev = player.py-10;
        if(player.vy>200 && feetPrev <= hd.y-38 && feetNow >= hd.y-38){
          player.vy=-520; hd.dead=true; hd.alert=0; SFX.stomp();
          poofs.push({x:hd.x, y:hd.y-20, t:0.5});
        } else if(Math.abs(hd.y-feetNow)<46 && player.safe<=0){
          die(); // enemy contact = you lose a life
        }
      }
    }

    // trail cam: cone detection
    for(const c of cams){
      if(c.dead) continue;
      c.ang = Math.sin(tick/40)*0.5;
      c.flash-=dt;
      // SMASH: airborne contact destroys the snitch cam
      if(!player.onGround && Math.abs((player.x+player.w/2)-c.x)<42 && Math.abs((player.y-60)-c.y)<64){
        c.dead=true; SFX.camSmash();
        poofs.push({x:c.x, y:c.y, t:0.5});
        for(let j=0;j<6;j++) poofs.push({x:c.x+(Math.random()*70-35), y:c.y+(Math.random()*50-25), t:0.3+Math.random()*0.3});
      }
      const dx = player.x - c.x;
      if(dx>0 && dx<420 && c.flash<=0){
        const dy = (player.y-40) - c.y;
        if(dy>120 && dy<340 && Math.abs(c.ang)<0.45){
          c.flash=1.5; alarm=4; SFX.snitch();
          for(const hd of hounds) if(!hd.dead && Math.abs(hd.x-c.x)<800) hd.alert=5;
          callHounds(c.x); // SEEN = hound pack called in — smash the cam or stay out of its cone
        }
      }
    }

    // drone — flies LOW (stompable); touching it mid-air knocks it out of the sky
    if(drone.dead){
      drone.fallT += dt;
      drone.fx = drone.sx + drone.fallT*30;
      drone.fy = drone.y + drone.fallT*drone.fallT*900;
      if(!drone.crashed && drone.fy >= GROUND_Y-16){
        drone.crashed=true; poofs.push({x:drone.fx, y:GROUND_Y-10, t:0.5});
        for(let j=0;j<5;j++) poofs.push({x:drone.fx+(Math.random()*60-30), y:GROUND_Y-(Math.random()*40), t:0.3+Math.random()*0.2});
      }
    } else {
      drone.t += dt;
      drone.sx = drone.x + Math.sin(drone.t*0.9)*150;
      const dxp = Math.abs(drone.sx-(player.x+player.w/2));
      const feetNow = player.y-10;
      // any airborne contact knocks the drone out of the sky (it's a spotter, not a fighter)
      if(!player.onGround && dxp<55 && feetNow > drone.y-26 && feetNow < drone.y+38){
        drone.dead=true; drone.fallT=0; drone.fx=drone.sx; SFX.droneDie();
        poofs.push({x:drone.sx, y:drone.y, t:0.4});
        if(player.vy>0) player.vy=-520; // falling = bounce off the wreck, rising = punch through
      }
      const spotHit = Math.abs(player.x+20-drone.sx)<60 && player.y>GROUND_Y-80 && player.x>3400 && player.x<3760;
      if(spotHit && alarm<=0){ alarm=3.5; for(const hd of hounds) if(!hd.dead) hd.alert=4; callHounds(drone.x); }
    }

    // snare trap
    if(!snare.sprung && Math.abs(player.x+20-snare.x)<26 && player.y>snare.y-40){
      snare.sprung=true; snare.timer=2.2; player.vx=0; SFX.snare();
    }
    if(snare.sprung){
      snare.timer-=dt;
      const jump2 = keys["Space"]||keys["ArrowUp"]||keys["KeyW"]||tBtn.jump.on;
      if(jump2 && !jump) snare.timer-=dt*2; // mash to escape faster
      if(snare.timer<=0){ snare.sprung=false; player.vy=-600; }
    }

    // token gate
    if(player.x>4420 && player.x<4500 && tokens<GATE_NEED){
      player.x=4415; mode="gate"; SFX.gate();
    }
    // flagpole!
    if(player.x+player.w*0.7 > poleX-8 && player.x < poleX+40 && player.y>poleTop){
      mode="flag"; player.slide=0; player.x=poleX-10; SFX.flag();
      carl.active=true; carl.x=carlTreeX; carl.emerge=0; carl.dir=1; // Carl steps out from behind the tree while you slide
    }
  }

  if(mode==="flag"){
    if(carl.active){ carl.emerge=Math.min(1,carl.emerge+dt/1.5); carl.x += 40*dt; } // Carl steps out while you slide
    player.slide += dt*1.4;
    player.y = poleTop + (GROUND_Y-player.y-20)*0 + player.slide*380;
    if(player.y>=GROUND_Y){ player.y=GROUND_Y; mode="portal"; }
  }

  if(mode==="portal"){
    carl.phase+=dt;
    if(carl.active){ // Carl bursts from behind the tree and chases — you escape by a whisker
      if(carl.emerge<1){ carl.emerge=Math.min(1,carl.emerge+dt/0.9); carl.x += 60*dt; }
      else carl.x = Math.min(portal.x-150, carl.x + 262*dt);
    }
    portal.r += dt*2;
    const dx = (portal.x-14) - player.x;
    if(Math.abs(dx)>8){ player.x += Math.sign(dx)*240*dt; player.face=Math.sign(dx); }
    else { mode="enter"; enterT=0; carl.lunge=1; enterFrom={x:player.x+player.w/2, y:player.y}; SFX.portal(); }
  }
  if(mode==="enter"){ // sucked into the swirl, then LEVEL CLEAR
    enterT += dt/1.1; portal.r += dt*6;
    if(enterT>=1){ mode="win"; SFX.win(); }
  }

  // camera
  const targetX = Math.max(0, Math.min(player.x - W/(2*ZOOM)/1, WORLD_W - W/ZOOM));
  camX += (targetX-camX)*Math.min(1,dt*6);
  if(mode==="title") camX=0;
}

// ---------- DRAW ----------
function drawBG(){
  // painted sky + mountains (generated art)
  if(ART.sky.complete) ctx.drawImage(ART.sky, 0, 0, W, H);
  else { let g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#24413c"); g.addColorStop(0.4,"#4a7a6b"); g.addColorStop(0.75,"#9fc8ad"); g.addColorStop(1,"#e8d9a0");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

  // drifting clouds (light wind of their own)
  ctx.fillStyle="rgba(232,244,230,0.16)";
  for(let i=0;i<5;i++){
    const cw=180+(i*67)%160, ch=26+(i*31)%18, span=W+cw*4;
    const cx2=(((i*620) - camX*0.04*ZOOM - tick*0.12) % span + span)%span - cw*2;
    const cy2=H*0.06+(i*83)%120;
    ctx.beginPath();
    ctx.ellipse(cx2,cy2,cw*0.5,ch,0,0,7);
    ctx.ellipse(cx2+cw*0.3,cy2+ch*0.35,cw*0.34,ch*0.8,0,0,7);
    ctx.ellipse(cx2-cw*0.32,cy2+ch*0.4,cw*0.3,ch*0.7,0,0,7);
    ctx.fill();
  }

  // painted cedar treeline strip (generated art) + one near code layer for depth
  if(ART.treeline.complete){
    const tl=ART.treeline, s=1.12, tw=tl.width*s, th=tl.height*s;
    const off=(-camX*0.25*ZOOM) % tw;
    const ty=GROUND_Y*ZOOM - th + 6;
    for(let k=0; k<=Math.ceil(W/tw)+1; k++) ctx.drawImage(tl, k*tw+off, ty, tw, th);
  }
  drawTreeLine(0.60,"#122a24","#193830",0.78,GROUND_Y*ZOOM*1.02,0);

  // drifting fog bands (alive, not painted)
  for(let i=0;i<3;i++){
    const fy = GROUND_Y*ZOOM*(0.30+i*0.17) + Math.sin(tick/140+i*2)*14;
    ctx.globalAlpha = 0.20-0.04*i;
    ctx.fillStyle="#cfe8d8";
    ctx.fillRect(0,fy,W,H*(0.09-0.015*i));
  }
  ctx.globalAlpha=1;

  // floating pollen motes catching the light
  for(let i=0;i<24;i++){
    const span=W+80;
    const mx=(((i*173) - camX*0.5*ZOOM - tick*0.35) % span + span)%span - 40;
    const my=(H*0.25) + (i*97)%(H*0.6) + Math.sin(tick/45+i)*12;
    ctx.fillStyle="rgba(255,240,190,0.5)";
    ctx.beginPath(); ctx.arc(mx,my, 2+(i%3), 0,7); ctx.fill();
  }

  // warm low sun glow
  const sg = ctx.createRadialGradient(W*0.78,H*0.16,20, W*0.78,H*0.16,H*0.62);
  sg.addColorStop(0,"rgba(255,235,170,0.30)"); sg.addColorStop(1,"rgba(255,235,170,0)");
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  // light shafts through the cedars
  ctx.save();
  ctx.globalAlpha=0.08; ctx.fillStyle="#ffe9b0";
  for(let i=0;i<5;i++){
    const span=W+900;
    const bx2 = ((i*380 - camX*0.15*ZOOM) % span + span)%span - 300;
    ctx.beginPath();
    ctx.moveTo(bx2,0); ctx.lineTo(bx2+60,0); ctx.lineTo(bx2+190,H); ctx.lineTo(bx2+70,H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawRidge(px,colr,baseY,freq,amp){
  const off=camX*px*ZOOM;
  ctx.fillStyle=colr; ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=24){
    const y=baseY + Math.sin((x+off*0.5)*freq)*amp*0.6 + Math.sin((x+off*0.3)*freq*2.7+2)*amp*0.4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawFore(){
  // sparse giant cedar trunks in the foreground plane — cinematic sweep, gameplay stays readable
  for(let i=0;i<6;i++){
    const wx=700+i*1500;
    const fx=(wx-camX*1.3)*ZOOM;
    if(fx < -200 || fx > W+200) continue;
    const tw=56*ZOOM+22;
    ctx.globalAlpha=0.9;
    ctx.fillStyle="#18312a";
    ctx.fillRect(fx,0,tw,H*0.86);
    ctx.fillStyle="rgba(255,235,170,0.05)"; ctx.fillRect(fx+tw*0.18,0,tw*0.22,H*0.86);
    ctx.fillStyle="rgba(46,107,82,0.5)";
    ctx.beginPath(); ctx.ellipse(fx+tw*0.5,H*0.18,tw*0.4,16,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx+tw*0.5,H*0.55,tw*0.34,13,0,0,7); ctx.fill();
    ctx.fillStyle="rgba(16,38,30,0.92)";
    ctx.beginPath(); ctx.ellipse(fx+tw*0.5,H*0.85,tw*0.72,36,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
}
function drawTreeLine(px, colr, colAlt, hgt, base, mist){
  const off = -camX*px*ZOOM;
  const span=W+460;
  for(let i=0;i<30;i++){
    const bx=(((i*230+off)%span)+span)%span - 230 + (i%2?90:0);
    const th = H*hgt*(0.75+((i*37)%40)/70);
    ctx.fillStyle = i%3===0 ? colAlt : colr;
    // trunk hint
    ctx.fillRect(bx-5, base-th*0.3, 10, th*0.3);
    // cedar tier stack
    for(let l=0;l<4;l++){
      const ly = base-th + th*0.30*l;
      const half = 40+hgt*26 - l*7;
      ctx.beginPath();
      ctx.moveTo(bx, ly);
      ctx.lineTo(bx-half, ly+th*0.30);
      ctx.lineTo(bx+half, ly+th*0.30);
      ctx.closePath(); ctx.fill();
    }
  }
  if(mist>0){
    ctx.globalAlpha=mist; ctx.fillStyle="#cfe8d8";
    ctx.fillRect(0, base-H*hgt*0.95, W, H*hgt*1.1);
    ctx.globalAlpha=1;
  }
}

function drawWorld(){
  ctx.save();
  ctx.translate(-camX*ZOOM,0); ctx.scale(ZOOM,ZOOM);

  // ground platforms — dressed: grass rim, swaying blades, dirt, hanging vines
  for(let pi=0;pi<plats.length;pi++){
    const p=plats[pi];
    // cull offscreen platforms
    if(p[0]+p[2]-camX < -80 || p[0]-camX > W/ZOOM+80) continue;
    // body
    ctx.beginPath(); rr(p[0],p[1],p[2],p[3],18);
    outline("#3f6b4f",5);
    // dirt texture dots
    ctx.fillStyle="#2c4d3a";
    for(let i=0;i<p[2]/70;i++){ ctx.beginPath(); ctx.ellipse(p[0]+35+i*70, p[1]+40+((i*53)%80), 22,10,0,0,7); ctx.fill(); }
    // grass tufts + light rim
    ctx.fillStyle="#5d9a6d";
    for(let i=0;i<p[2]/90;i++){ ctx.beginPath(); ctx.ellipse(p[0]+45+i*90, p[1]+6, 26,8,0,0,7); ctx.fill(); }
    ctx.strokeStyle="rgba(180,230,190,0.35)"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(p[0]+12,p[1]+7); ctx.lineTo(p[0]+p[2]-12,p[1]+7); ctx.stroke();
    // swaying grass blades
    for(let i=0;i<p[2]/55;i++){
      const gx=p[0]+22+i*55+(i*29%17), gh=10+(i*13)%9;
      const sway=Math.sin(tick/16+i)*3;
      ctx.strokeStyle="#6fae7d"; ctx.lineWidth=3; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(gx,p[1]+2); ctx.quadraticCurveTo(gx+sway,p[1]-gh*0.6, gx+sway*1.6,p[1]-gh); ctx.stroke();
    }
    // hanging vines w/ leaf tips (every other plat)
    if(pi%2===0 && p[3]>40){ for(let v=0;v<3;v++){
      const vx=p[0]+40+((v*137)%(p[2]>160?p[2]-80:80));
      const vl=26+(v*23)%30, sway=Math.sin(tick/26+v+pi)*5;
      ctx.strokeStyle="#3f6b4f"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(vx,p[1]+p[3]-6); ctx.quadraticCurveTo(vx+sway,p[1]+p[3]+vl*0.6, vx+sway*1.4, p[1]+p[3]+vl); ctx.stroke();
      ctx.fillStyle="#5d9a6d"; ctx.beginPath(); ctx.arc(vx+sway*1.4, p[1]+p[3]+vl+3, 4,0,7); ctx.fill();
    }}
    // cedar sprites on long plats (generated reference art)
    if(p[2]>600){ const n=Math.floor(p[2]/320);
      for(let i=0;i<n;i++){
        const tx=p[0]+110+i*320, ty=p[1];
        if(tx>4700) continue; // ending zone: only Carl's cedar stands
        if(tx-camX < -160 || tx-camX > W/ZOOM+160) continue;
        if(ART.cedar.complete){
          const s=0.62+((i*37)%20)/100, cw=200*s, chh=cw*ART.cedar.height/ART.cedar.width;
          ctx.drawImage(ART.cedar, tx-cw/2, ty-chh, cw, chh);
          ctx.fillStyle="rgba(93,154,109,0.5)"; ctx.beginPath(); ctx.ellipse(tx-8,ty-8,30*s,10*s,0,0,7); ctx.fill();
        }
      }
    }
  }

  // forest-floor dressing: ferns, mushrooms, rocks, flowers, stumps (decorative lore of the woods)
  {
    let seed=7;
    const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    const kinds=["fern","fern","shroom","rock","flower","stump"];
    for(let i=0;i<44;i++){
      const x=90+i*118+rnd()*60, k=kinds[Math.floor(rnd()*kinds.length)], sc=0.7+rnd()*0.6;
      if(x-camX < -70 || x-camX > W/ZOOM+70) continue;
      const onG = plats.some(p=> p[1]>=GROUND_Y-1 && x>p[0]-10 && x<p[0]+p[2]+10);
      if(!onG) continue;
      ctx.save(); ctx.translate(x, GROUND_Y+2); ctx.scale(sc,sc);
      if(k==="fern"){
        for(let b=0;b<5;b++){
          const a=-2.2+b*0.55, len=34;
          ctx.strokeStyle="#3f8a5f"; ctx.lineWidth=5; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(Math.cos(a)*len*0.5,-len*0.7, Math.cos(a)*len, -Math.abs(Math.sin(a))*len-len*0.4); ctx.stroke();
          ctx.fillStyle="#4fa571"; ctx.beginPath(); ctx.arc(Math.cos(a)*len, -Math.abs(Math.sin(a))*len-len*0.4, 5,0,7); ctx.fill();
        }
      } else if(k==="shroom"){
        ctx.fillStyle="#e8d9a0"; ctx.fillRect(-5,-16,10,16);
        ctx.beginPath(); ctx.arc(0,-18,13,Math.PI,0); outline("#e23b2e",5);
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(-5,-22,2.5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(4,-20,2,0,7); ctx.fill();
      } else if(k==="rock"){
        ctx.beginPath(); ctx.moveTo(-16,0); ctx.quadraticCurveTo(-12,-20,0,-22); ctx.quadraticCurveTo(14,-20,16,0); ctx.closePath(); outline("#7f8c83",5);
        ctx.fillStyle="rgba(93,154,109,0.5)"; ctx.beginPath(); ctx.ellipse(0,-16,9,4,0,0,7); ctx.fill();
      } else if(k==="flower"){
        ctx.strokeStyle="#3f8a5f"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-16); ctx.stroke();
        for(let pt=0;pt<5;pt++){ const a=pt*1.256; ctx.fillStyle="#f2c94c"; ctx.beginPath(); ctx.arc(Math.cos(a)*7,-18+Math.sin(a)*7,5,0,7); ctx.fill(); }
        ctx.fillStyle="#141c1f"; ctx.beginPath(); ctx.arc(0,-18,3.5,0,7); ctx.fill();
      } else {
        ctx.beginPath(); rr(-12,-18,24,18,4); outline("#5a4632",5);
        ctx.beginPath(); ctx.ellipse(0,-18,12,5,0,0,7); outline("#8a6a3c",4);
      }
      ctx.restore();
    }
  }

  // BIGFOOT PRINTS (branding/lore only — sole + five toes, pressed into the dirt)
  const fp=[[210],[380],[560],[1130],[1290],[1830],[2050],[2860],[3350],[3900],[4450],[4830]];
  for(const f of fp){
    if(f[0]-camX < -60 || f[0]-camX > W/ZOOM+60) continue;
    ctx.save(); ctx.translate(f[0], GROUND_Y-10); ctx.rotate(0.10); ctx.globalAlpha=0.5;
    ctx.fillStyle="#12211c";
    ctx.beginPath(); ctx.ellipse(0,0,9,17,0,0,7); ctx.fill();
    for(let t2=0;t2<5;t2++){ ctx.beginPath(); ctx.arc(-12+t2*6, -16, 3.2,0,7); ctx.fill(); }
    ctx.restore();
  }

  // Big Tokens: gold coins with BIG wordmark
  for(const t of tokenPos){
    if(t.got) continue;
    const bob = Math.sin(tick/20 + t.x/40)*5;
    ctx.save(); ctx.translate(t.x, t.y+bob);
    ctx.beginPath(); ctx.arc(0,0,20,0,7); outline("#f2c94c",5);
    ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fillStyle="#141c1f"; ctx.fill();
    ctx.fillStyle="#39e6a0"; ctx.font="bold 15px 'Arial Black',sans-serif"; ctx.textAlign="center";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=8; ctx.fillText("BIG",0,5.5); ctx.shadowBlur=0;
    ctx.restore();
  }

  // snare trap
  if(!snare.sprung){
    ctx.strokeStyle="#8a6a3c"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.ellipse(snare.x, snare.y-6, 26,10,0,0,7); ctx.stroke();
    ctx.strokeStyle="#c9a35f"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(snare.x, snare.y-6, 16,6,0,0,7); ctx.stroke();
  } else {
    ctx.strokeStyle="#c9a35f"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(snare.x, snare.y-40, 24, 0, 7); ctx.stroke();
  }

  // stomp poofs (expanding dust)
  for(const p of poofs){
    const k = 1-p.t/0.5;
    ctx.globalAlpha = Math.max(0, p.t*2);
    for(let j=0;j<4;j++){
      const a = j*1.57 + k*2;
      ctx.beginPath(); ctx.arc(p.x+Math.cos(a)*k*46, p.y+Math.sin(a)*k*30-8*k, 12*(1-k*0.6), 0, 7);
      ctx.fillStyle="#eaffd8"; ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // hounds (dead ones stay gone)
  for(const hd of hounds){
    if(hd.dead) continue;
    ctx.save(); ctx.translate(hd.x, hd.y + Math.sin(tick/6)*2*(hd.alert>0?1.4:1));
    ctx.scale(hd.dir,1);
    if(ART.hound.complete){
      const hw=86, hh=hw*ART.hound.height/ART.hound.width;
      ctx.drawImage(ART.hound, -hw/2, -hh, hw, hh);
    } else {
      ctx.beginPath(); ctx.ellipse(0,-26,34,20,0,0,7); outline(hd.alert>0?"#b56a4a":"#a97c50",5);
    }
    // alert badge
    if(hd.alert>0){ ctx.fillStyle="#e23b2e"; ctx.beginPath(); ctx.moveTo(30,-62); ctx.lineTo(40,-74); ctx.lineTo(46,-60); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

  // trail camera (tree-mounted, detection cone)
  for(const c of cams){
    if(c.dead) continue; // smashed = gone
    ctx.fillStyle="#4a3a2a"; ctx.fillRect(c.x-6, c.y, 12, GROUND_Y-c.y); // trunk down to ground
    ctx.beginPath(); ctx.ellipse(c.x-46, c.y+150, 60, 28, 0.3,0,7); ctx.fillStyle="#2f6b52"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+46, c.y+150, 60, 28, -0.3,0,7); ctx.fill();
    ctx.save(); ctx.translate(c.x, c.y);
    if(ART.trailcam.complete){
      const cw=42, chh=cw*ART.trailcam.height/ART.trailcam.width;
      ctx.drawImage(ART.trailcam, -cw/2, -chh/2, cw, chh);
    }
    ctx.beginPath(); ctx.arc(16,2,7,0,7); ctx.fillStyle= c.flash>0 ? "#ff4030" : "#39e6a0"; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle="#12211c"; ctx.stroke();
    // detection cone
    ctx.globalAlpha = c.flash>0 ? 0.35 : 0.12;
    ctx.fillStyle = c.flash>0 ? "#ff4030" : "#39e6a0";
    ctx.beginPath(); ctx.moveTo(16,2);
    ctx.lineTo(190, 120+Math.tan(c.ang)*90); ctx.lineTo(190, 330+Math.tan(c.ang)*90);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.restore();
    if(c.flash>0){ // red flash frame alert
      ctx.globalAlpha=0.5; ctx.fillStyle="#ff4030";
      ctx.fillRect(c.x-60, c.y+180, 120, 8); ctx.globalAlpha=1;
    }
  }

  // drone + spotlight (falling wreck once stomped)
  {
    const dx = drone.dead ? drone.fx : drone.sx;
    const dy = drone.dead ? drone.fy : drone.y;
    if(!drone.crashed){
      ctx.save(); ctx.translate(dx, dy); if(drone.dead) ctx.rotate(drone.fallT*7);
      if(ART.drone.complete){
        const dw=64, dhh=dw*ART.drone.height/ART.drone.width;
        const bob2 = Math.sin(tick/2)*2;
        ctx.drawImage(ART.drone, -dw/2, -dhh/2+bob2, dw, dhh);
      }
      ctx.beginPath(); ctx.arc(0,10,5,0,7); ctx.fillStyle= drone.dead ? "#ff4030" : (alarm>0 ? "#ff4030":"#39e6a0"); ctx.fill();
      ctx.restore();
    }
    if(!drone.dead){
      // spotlight beam
      ctx.globalAlpha= alarm>0?0.3:0.16;
      ctx.fillStyle= alarm>0 ? "#ff6a50":"#bfe8c8";
      ctx.beginPath(); ctx.moveTo(drone.sx-10,drone.y+10); ctx.lineTo(drone.sx-70,GROUND_Y); ctx.lineTo(drone.sx+70,GROUND_Y); ctx.lineTo(drone.sx+10,drone.y+10); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
      // tether line up
      ctx.strokeStyle="rgba(30,50,40,0.4)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(drone.x,0); ctx.lineTo(drone.sx,drone.y); ctx.stroke();
    }
  }

  // Skeptic Steve cameo — watching from the far side of the woods with his clipboard
  if(mode!=="title" && ART.steve.complete && 4480-camX > -140 && 4480-camX < W/ZOOM+140){
    ctx.save(); ctx.globalAlpha=0.92;
    ctx.translate(4480, GROUND_Y-6); ctx.scale(-1,1); // faces left, toward the player
    const sw=96, shh=sw*ART.steve.height/ART.steve.width;
    ctx.drawImage(ART.steve, -sw/2, -shh, sw, shh);
    ctx.restore();
  }

  // checkpoint posts — reach one, it lights up; die and you respawn here
  for(let i=1;i<checkpoints.length;i++){
    const cp=checkpoints[i], lit = player.maxX>=cp.x-10;
    ctx.fillStyle="#6b4f2f"; ctx.fillRect(cp.x-5, GROUND_Y-64, 10, 64);
    ctx.beginPath(); ctx.arc(cp.x, GROUND_Y-76, 16, 0, 7);
    ctx.fillStyle= lit ? "#39e6a0" : "#3a4a44"; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle="#12211c"; ctx.stroke();
    ctx.fillStyle= lit ? "#0a140f" : "#8fb8a4";
    ctx.font="bold 12px 'Space Grotesk',Arial"; ctx.textAlign="center";
    ctx.fillText("BIG", cp.x, GROUND_Y-72);
  }

  // token gate
  {
    ctx.fillStyle="#223a30";
    ctx.fillRect(4450, GROUND_Y-150, 14, 150); ctx.fillRect(4610, GROUND_Y-150, 14, 150);
    ctx.fillStyle="#39e6a0"; ctx.font="bold 26px 'Arial Black',sans-serif"; ctx.textAlign="center";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=10;
    ctx.fillText(tokens+"/"+GATE_NEED, 4537, GROUND_Y-70);
    ctx.shadowBlur=0;
    if(tokens<GATE_NEED){
      ctx.strokeStyle="rgba(255,80,60,0.7)"; ctx.lineWidth=4; ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(4537, GROUND_Y-140); ctx.lineTo(4537, GROUND_Y); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // flagpole + flag (BIG Network wordmark, NO paw prints)
  {
    ctx.fillStyle="#7a5f3e"; ctx.fillRect(poleX-7, poleTop, 14, GROUND_Y-poleTop);
    ctx.beginPath(); ctx.arc(poleX, poleTop-6, 9,0,7); outline("#f2c94c",4);
    // flag: dark with glowing BIG wordmark
    const fw=150, fh=84, wave=Math.sin(tick/12)*7;
    ctx.beginPath(); ctx.moveTo(poleX+7, poleTop+2);
    ctx.quadraticCurveTo(poleX+7+fw/2, poleTop+2+wave, poleX+7+fw, poleTop+14);
    ctx.lineTo(poleX+7+fw, poleTop+14+fh-14);
    ctx.quadraticCurveTo(poleX+7+fw/2, poleTop+2+fh-14+wave, poleX+7, poleTop+2+fh);
    ctx.closePath(); outline("#141c1f",5);
    ctx.save();
    ctx.clip();
    ctx.fillStyle="#39e6a0"; ctx.font="bold 40px 'Space Grotesk','Arial Black',sans-serif";
    ctx.shadowColor="#39e6a0"; ctx.shadowBlur=14;
    // per-letter draw: guarantees all three glyphs land inside the waving flag
    const flagLetters=["B","I","G"]; let lx=poleX+24;
    for(const ch of flagLetters){ ctx.fillText(ch, lx, poleTop+60); lx += ctx.measureText(ch).width - 3; }
    ctx.shadowBlur=0; ctx.restore();
    // stone arch portal
    {
      const px=portal.x, py=portal.y;
      ctx.beginPath(); ctx.arc(px-62, py, 22,0,7); outline("#6d7a72",5);
      ctx.beginPath(); ctx.arc(px+62, py, 22,0,7); outline("#6d7a72",5);
      ctx.beginPath(); rr(px-90, py-118, 180, 26, 12); outline("#6d7a72",5);
      ctx.beginPath(); rr(px-84, py-108, 168, 20, 10); ctx.fillStyle="#7f8c83"; ctx.fill();
      // swirl
      const grd = ctx.createRadialGradient(px,py-50,6,px,py-50,64);
      grd.addColorStop(0,"#eaffd8"); grd.addColorStop(0.5,"#39e6a0"); grd.addColorStop(1,"#0f4a34");
      ctx.beginPath(); ctx.ellipse(px, py-50, 56, 62, 0,0,7); ctx.fillStyle=grd; ctx.fill();
      ctx.lineWidth=5; ctx.strokeStyle="#12211c"; ctx.stroke();
      for(let s=0;s<3;s++){
        ctx.globalAlpha=0.5; ctx.strokeStyle="#eaffd8"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px, py-50, 18+s*14 + (portal.r*10)%14, tick*0.02, tick*0.02+4); ctx.stroke(); ctx.globalAlpha=1;
      }
    }
  }

  // catcher cameo: Carl runs across near the flagpole
  if((carl.active || mode==="portal" || mode==="win") && ART.carl.complete){
    const bob = Math.sin(tick/5)*2;
    ctx.save(); ctx.translate(carl.x, carl.y+bob); ctx.scale(carl.dir,1);
    if(carl.lunge) ctx.rotate(-0.18); // lunging reach as the Lil Foot slips away
    const cw=124, chh=cw*ART.carl.height/ART.carl.width; // ~150px tall hunter
    ctx.drawImage(ART.carl, -cw/2, -chh, cw, chh);
    if(carl.lunge){ // last-grab reach at the portal — misses by a whisker
      ctx.strokeStyle="#e0b58a"; ctx.lineWidth=9; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(cw*0.3,-70); ctx.lineTo(cw*0.3+46,-56); ctx.stroke();
      ctx.beginPath(); ctx.arc(cw*0.3+50,-56,8,0,7); outline("#e0b58a",3);
    }
    ctx.restore();
  }

  // the cedar Carl bursts from — drawn over him so he comes out from BEHIND the trunk
  if(carlTreeX-camX > -250 && carlTreeX-camX < W/ZOOM+250 && ART.cedar.complete){
    const tx=carlTreeX, ty=GROUND_Y;
    const cw=210, chh=cw*ART.cedar.height/ART.cedar.width; // the big cedar Carl bursts from
    ctx.drawImage(ART.cedar, tx-cw/2, ty-chh, cw, chh);
    ctx.fillStyle="rgba(93,154,109,0.5)"; ctx.beginPath(); ctx.ellipse(tx-10,ty-8,34,11,0,0,7); ctx.fill();
  }

  // PLAYER: the chosen Lil Foot — Bude's official ref art, unmodified (bg removed)
  {
    let px=player.x+player.w/2, py=player.y, sc=1, rot=0, al=1;
    if(player.safe>0 && Math.sin(tick/3)<0) al=0.35; // spawn invuln flicker
    if(mode==="enter"){
      const k=Math.min(1,enterT);
      px = enterFrom.x + (portal.x-enterFrom.x)*k;
      py = enterFrom.y + (portal.y-50-enterFrom.y)*k;
      sc = 1-0.85*k; rot=k*4; al=1-k;
    } else {
      ctx.save();
      ctx.globalAlpha=0.28; ctx.fillStyle="#0a140f";
      ctx.beginPath(); ctx.ellipse(px, player.y+3, 24, 7, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(px, py); ctx.rotate(rot);
    let sxq=1, syq=1;
    if(player.onGround && Math.abs(player.vx)>10){ const b=Math.sin(tick/8)*0.03; syq=1-b; sxq=1+b; }
    else if(!player.onGround){ syq=1.05; sxq=0.96; }
    ctx.scale(-player.face*sxq*sc, syq*sc); // art faces left natively → flip so characters face travel direction
    if(player.hurt>0){ ctx.globalAlpha = (Math.sin(tick*1.5)>0?0.4:1); player.hurt-=0.02; }
    ctx.globalAlpha *= al;
    const spr = CAST[castSel].img || CAST[0].img;
    if(spr.complete && spr.naturalWidth){
      const SH=104, sw=SH*(spr.naturalWidth/spr.naturalHeight);
      ctx.drawImage(spr, -sw/2, -SH, sw, SH);
    } else {
      ctx.beginPath(); rr(-19,-58, 38, 40, 14); outline("#7ec850",5);
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawHUD(){
  if(mode==="title"){
    ctx.fillStyle="rgba(10,20,16,"+0.35*titleFade+")"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#eaffd8"; ctx.font="bold "+Math.round(64*ZOOM)+"px 'Space Grotesk','Arial Black',sans-serif";
    ctx.shadowColor="#0f4a34"; ctx.shadowBlur=0;
    ctx.fillText("LIL FOOTS", W/2, H*0.34);
    ctx.fillStyle="#f2c94c"; ctx.fillText("BIG ADVENTURE", W/2, H*0.34+70*ZOOM);
    ctx.shadowBlur=0;
    // CAST SELECT ROW — the actual characters (Bude's refs), tap zones = drawn chips exactly
    for(const rc of castChipRects()){
      const sel = rc.i===castSel;
      ctx.save();
      if(sel){ ctx.shadowColor="#39e6a0"; ctx.shadowBlur=22; }
      ctx.beginPath(); rr(rc.x, rc.y, rc.w, rc.h, 14*ZOOM); ctx.fillStyle="rgba(20,28,31,0.88)"; ctx.fill();
      ctx.lineWidth=sel?4:2; ctx.strokeStyle=sel?"#39e6a0":"#3a4a44"; ctx.stroke();
      ctx.shadowBlur=0;
      const im=CAST[rc.i].img;
      if(im.complete && im.naturalWidth){
        const ih=rc.h*0.80, iw=ih*im.naturalWidth/im.naturalHeight;
        ctx.drawImage(im, rc.x+(rc.w-iw)/2, rc.y+rc.h*0.07, iw, ih);
      }
      ctx.textAlign="center"; ctx.fillStyle=sel?"#f2c94c":"#8fb8a4";
      ctx.font="bold "+Math.round(17*ZOOM)+"px 'Space Grotesk',Arial";
      ctx.fillText(CAST[rc.i].name, rc.x+rc.w/2, rc.y+rc.h-9*ZOOM);
      ctx.restore();
    }
    ctx.fillStyle="#cfe8d8"; ctx.font="bold "+Math.round(19*ZOOM)+"px Trebuchet MS";
    ctx.globalAlpha = Math.sin(tick/20)>0 ? 1:0.4;
    ctx.fillText("< pick your Lil Foot >  —  TAP or SPACE to start", W/2, H*0.74);
    ctx.globalAlpha=1;
    ctx.font="14px Trebuchet MS"; ctx.fillStyle="#8fb8a4";
    ctx.fillText("Vertical Slice v0.5.2 — ART PASS: painted sky/treeline backdrops, sprite cedars, enemy reference art (Carl, hound, trail cam, drone, Steve cameo), escape chase", W/2, H*0.92);
    return;
  }
  // token counter
  ctx.save(); ctx.scale(ZOOM,ZOOM);
  ctx.beginPath(); ctx.arc(40,40,22,0,7); outline("#f2c94c",5);
  ctx.beginPath(); ctx.arc(40,40,14,0,7); ctx.fillStyle="#141c1f"; ctx.fill();
  ctx.fillStyle="#39e6a0"; ctx.font="bold 13px 'Arial Black'"; ctx.textAlign="center";
  ctx.fillText("BIG",40,44);
  ctx.fillStyle="#eaffd8"; ctx.font="bold 24px 'Space Grotesk','Arial Black'"; ctx.textAlign="left";
  ctx.fillText(tokens+" / "+tokensTotal, 72, 48);
  // alarm badge
  if(alarm>0){
    ctx.fillStyle= Math.sin(tick*1.4)>0 ? "#e23b2e":"#a52a20";
    ctx.font="bold 15px 'Arial Black'"; ctx.textAlign="center";
    ctx.fillText("SPOTTED! HOUNDS ALERTED", 350, 42);
  }
  ctx.restore();

  // region title card
  if(regionFade>0){
    ctx.globalAlpha=Math.min(1,regionFade);
    ctx.textAlign="center"; ctx.fillStyle="#eaffd8";
    ctx.font="bold "+Math.round(46*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.fillText("THE MISTY HOLLOW", W/2, H*0.3);
    ctx.font="italic "+Math.round(18*ZOOM)+"px Georgia";
    ctx.fillText("run, jump, reach the BIG flag", W/2, H*0.3+34*ZOOM);
    ctx.globalAlpha=1;
  }

  if(mode==="gate"){
    ctx.textAlign="center"; ctx.fillStyle="#eaffd8";
    ctx.font="bold "+Math.round(26*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.globalAlpha=0.9;
    ctx.fillText("BIG TOKEN GATE — need "+GATE_NEED+" tokens to pass", W/2, H*0.3);
    ctx.fillText("you have "+tokens, W/2, H*0.3+34*ZOOM);
    ctx.globalAlpha=1;
  }

  if(mode==="over"){
    ctx.fillStyle="rgba(10,20,16,0.75)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#ff5a5a"; ctx.font="bold "+Math.round(56*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.fillText("GAME OVER", W/2, H*0.38);
    ctx.fillStyle="#eaffd8"; ctx.font="bold "+Math.round(20*ZOOM)+"px Trebuchet MS";
    ctx.fillText("The woods keep their secrets... the Catcher wins this round.", W/2, H*0.38+44*ZOOM);
    ctx.globalAlpha=Math.sin(tick/20)>0?1:0.4;
    ctx.fillStyle="#f2c94c"; ctx.font="bold "+Math.round(22*ZOOM)+"px 'Space Grotesk',Arial";
    ctx.fillText("tap to restart at the beginning", W/2, H*0.58); ctx.globalAlpha=1;
  }

  if(mode==="win"){
    ctx.fillStyle="rgba(10,20,16,0.55)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#f2c94c"; ctx.font="bold "+Math.round(52*ZOOM)+"px 'Space Grotesk','Arial Black'";
    ctx.fillText("LEVEL CLEAR!", W/2, H*0.4);
    ctx.fillStyle="#eaffd8"; ctx.font="bold "+Math.round(22*ZOOM)+"px Trebuchet MS";
    ctx.fillText(tokens+" Big Tokens collected — portal to Level 2", W/2, H*0.4+44*ZOOM);
    ctx.globalAlpha=Math.sin(tick/20)>0?1:0.4;
    ctx.fillText("tap to replay", W/2, H*0.62); ctx.globalAlpha=1;
  }

  // lives (hearts top-left)
  if(mode!=="title" && mode!=="win" && mode!=="over"){
    for(let i=0;i<3;i++){
      const hx=34+i*40, hy=44;
      ctx.save(); ctx.translate(hx,hy); ctx.scale(1.3,1.3);
      ctx.beginPath();
      ctx.moveTo(0,7); ctx.bezierCurveTo(-17,-6,-9,-19,0,-9); ctx.bezierCurveTo(9,-19,17,-6,0,7);
      ctx.fillStyle = i<lives ? "#ff5a5a" : "rgba(255,90,90,0.15)"; ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle="#12211c"; ctx.stroke();
      ctx.restore();
    }
  }

  // mute toggle (top-right)
  {
    const mx=W-52,my=52;
    ctx.save();
    ctx.beginPath(); ctx.arc(mx,my,26,0,7);
    ctx.fillStyle="rgba(20,28,31,0.6)"; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle="#39e6a0"; ctx.stroke();
    ctx.fillStyle=AU.on?"#39e6a0":"#8fb8a4"; ctx.font="bold 26px Trebuchet MS"; ctx.textAlign="center";
    ctx.fillText(AU.on?"\u266A":"\u2715", mx, my+9);
    ctx.restore();
  }

  // touch control deck (arrows left, JUMP right)
  if(drawTouch() && (mode==="play"||mode==="flag")){
    ctx.globalAlpha=0.9; ctx.textAlign="center";
    for(const k in tBtn){
      const b=tBtn[k], r = k==="jump"?64:46;
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x*W, b.y*H, r, 0, 7);
      if(b.on){ ctx.fillStyle="rgba(57,230,160,0.85)"; ctx.shadowColor="#39e6a0"; ctx.shadowBlur=18; }
      else ctx.fillStyle="rgba(234,255,216,0.16)";
      ctx.fill(); ctx.shadowBlur=0;
      ctx.lineWidth=3; ctx.strokeStyle= b.on? "#eaffd8":"rgba(234,255,216,0.5)"; ctx.stroke();
      ctx.fillStyle = b.on? "#0a140f":"#eaffd8"; ctx.font="bold "+(k==="jump"?22:20)+"px Trebuchet MS";
      ctx.fillText(k==="left"?"◀":k==="right"?"▶":"JUMP", b.x*W, b.y*H+7);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}

// ---------- MAIN LOOP ----------
let last=0;
function frame(ts){
  const dt = Math.min(0.033, (ts-last)/1000 || 0.016); last=ts;
  update(dt);
  ctx.setTransform(1,0,0,1,0,0);
  drawBG();
  drawWorld();
  drawFore(); // big trunks sweeping past IN FRONT (parallax 1.3)
  drawHUD();
  // cinematic vignette
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45, W/2,H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0,"rgba(6,14,10,0)"); vg.addColorStop(1,"rgba(6,14,10,0.34)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
