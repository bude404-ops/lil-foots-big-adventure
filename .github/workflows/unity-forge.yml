name: Lil Foots Unity Forge

# Lil Foots: Big Adventure — the real Unity build (Bude's call, Sept 18 2026: "begin making it in unity").
# Host-runner + docker-run pattern: GitHub's runner disk cannot fit the unityci image pulled as a
# job container (both Sept 18 runs died: "no space left on device"). We free ~25GB first, then pull
# and run the image manually. QC_OUT pins shot output to <workspace>/unity/QCShots.
# Sept 18: added parallel webgl job + Pages publish — Bude's live remote link to watch the game.
on:
  workflow_dispatch:
    inputs:
      btok:
        description: 'Telegram bot token'
        required: true
      uuser:
        description: 'Unity account email'
        required: true
      upass:
        description: 'Unity account password'
        required: true
      gtok:
        description: 'Token to push the WebGL build to the live repo (mcontwitter-glitch/lil-foots-live)'
        required: true
      layers:
        description: 'Layer-by-layer review mode: build only the first N map layers (99 = full map)'
        required: false
        default: '99'
      ui:
        description: 'UI pass mode: build only character menu + controls + hearts (no world)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build map 001 + QC shots + APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      UIMG: unityci/editor:ubuntu-2022.3.50f1-android-3.2.2
      LAYERS: ${{ inputs.layers || '99' }}
      LILFOOTS_LAYERS: ${{ inputs.layers || '99' }}
      LILFOOTS_UI: ${{ inputs.ui }}
    steps:
      - name: Free disk for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/bin/terraform /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: Pull Unity image
        run: docker pull "$UIMG"
      - name: License + build scene + art pass + QC shots
        id: forge
        env:
          UUSER: ${{ inputs.uuser }}
          UPASS: ${{ inputs.upass }}
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e QC_OUT=/project/unity/QCShots -e APK_OUT=/project/unity/Builds/LilFoots.apk \
            -e UUSER -e UPASS -e LAYERS -e LILFOOTS_LAYERS -e LILFOOTS_UI \
            "$UIMG" bash -c '
              LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
              if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
              "$LIC" --activate-all --include-personal --username "$UUSER" --password "$UPASS" > /tmp/act.log 2>&1 || true
              if ! grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log; then echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 10; fi
              echo "LICENSE OK"
              mkdir -p /project/unity/QCShots
              METHOD="LilFoots.EditorTools.LilFootsBuildRunner.BuildAndShipApk"
              if [ "$LILFOOTS_UI" = "1" ]; then
                METHOD="LilFoots.EditorTools.LilFootsArtPass.BuildAndShoot"
              fi
              if [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ]; then
                METHOD="LilFoots.EditorTools.LilFootsArtPass.BuildAndShoot"
              fi
              echo "FORGE METHOD: $METHOD (LAYERS=$LAYERS)"
              xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit \
                -logFile /project/unity-forge.log -projectPath /project/unity \
                -executeMethod "$METHOD"
            '
          echo "forge_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Relay QC shots to Bude
        if: always()
        run: |
          FX="${{ steps.forge.outputs.forge_exit }}"
          PRE="LIL FOOTS UNITY PASS 1"
          if [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ]; then PRE="MAP REBUILD - LAYER $LAYERS of 3 (3-layer doctrine: 1=static vista, 2=gameplay plane, 3=foreground props; layers above $LAYERS intentionally absent)"; fi
          if [ "$LILFOOTS_UI" = "1" ]; then PRE="UI PASS - CHARACTER MENU / CONTROLS / HEARTS (HQ style, no world layers in this build)"; fi
          CAP1="$PRE — Map 001 start. FX=$FX"
          CAP2="$PRE — mid-map. FX=$FX"
          CAP3="$PRE — finish. FX=$FX"
          # Bude (Sept 18): "stop sending me 3 lol only need 1" -> layer reviews send ONE shot.
          if [ "$LILFOOTS_UI" = "1" ]; then
            for i in 1 2; do
              case $i in
                1) F=ui_menu.png; C="$PRE — character menu, pick your Lil Foot. FX=$FX";;
                2) F=ui_hud.png; C="$PRE — hearts, token counter, LEFT/RIGHT/JUMP buttons. FX=$FX";;
              esac
              P="unity/QCShots/$F"
              if [ -f "$P" ]; then
                curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${C}" || true
              fi
            done
          elif [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ]; then
            P="unity/QCShots/unity_start.png"
            if [ -f "$P" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${CAP1}" || true
            fi
          else
          for i in 1 2 3; do
            case $i in 1) F=unity_start.png; C="$CAP1";; 2) F=unity_mid.png; C="$CAP2";; 3) F=unity_gate.png; C="$CAP3";; esac
            P="unity/QCShots/$F"
            if [ -f "$P" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${C}" || true
            fi
          done
          fi
          if [ -f "unity/Builds/LilFoots.apk" ]; then
            SZ=$(stat -c%s "unity/Builds/LilFoots.apk")
            echo "apk size: $SZ"
            if [ "$SZ" -lt 49000000 ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendDocument" \
                -F "chat_id=${BIG_CHAT}" \
                -F "document=@unity/Builds/LilFoots.apk" \
                -F "caption=Unity-built build of Lil Foots (per your source-of-truth law: Unity imported it, compiled it, validated it, BUILT it). Map 001 + full art pass. Feel test: run, jump, tokens, hounds, cams, gate." || true
            else
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" -F "chat_id=${BIG_CHAT}" -F "text=Lil Foots APK built ($SZ bytes) — over Telegram's 50MB send cap, it's in the run artifact." || true
            fi
          fi
          if [ ! -f "unity/QCShots/unity_start.png" ] && [ ! -f "unity/QCShots/ui_menu.png" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" -F "chat_id=${BIG_CHAT}" -F "text=LIL FOOTS UNITY FORGE: build failed (FX=$FX) — logs in artifact." || true
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilfoots-unity-forge
          path: |
            unity/Assets/Scenes/**
            unity/QCShots/**
            unity/Builds/**
            unity-forge.log
          retention-days: 14
      - name: Fail flag
        if: steps.forge.outputs.forge_exit != '0'
        run: echo "FORGE FAILED"; exit 1

  webgl:
    name: Build WebGL (live web preview for Bude)
    # Bude (Sept 18 ~11:54 PM ET): "this link the game was still incorrect lets make sure its right
    # before you build" -> NO live-link publishes while a review is open (layer QC or UI QC).
    # The link only updates once the map layers are approved; reviews go shot-by-shot via DM.
    if: ${{ (!inputs.layers || inputs.layers == '99') && inputs.ui != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      UIMG: unityci/editor:ubuntu-2022.3.50f1-webgl-3.2.2
    steps:
      - name: Free disk for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/bin/terraform /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: Pull Unity image
        run: docker pull "$UIMG"
      - name: License + WebGL build
        id: webgl
        env:
          UUSER: ${{ inputs.uuser }}
          UPASS: ${{ inputs.upass }}
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e QC_OUT=/project/unity/QCShots -e WEBGL_OUT=/project/unity/Builds/WebGL \
            -e UUSER -e UPASS \
            "$UIMG" bash -c '
              LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
              if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
              "$LIC" --activate-all --include-personal --username "$UUSER" --password "$UPASS" > /tmp/act.log 2>&1 || true
              if ! grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log; then echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 10; fi
              echo "LICENSE OK"
              mkdir -p /project/unity/QCShots
              xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit \
                -logFile /project/unity-webgl.log -projectPath /project/unity \
                -executeMethod LilFoots.EditorTools.LilFootsBuildRunner.BuildAndShipWebGl
            '
          docker_rc=$?
          # Pages safety net: if Unity still emitted .gz files, strip them for raw static hosting
          if [ -d unity/Builds/WebGL ] && ls unity/Builds/WebGL/*.gz >/dev/null 2>&1; then
            echo "GZ files present — decompressing for static hosting"
            for f in unity/Builds/WebGL/*.gz; do gunzip -f "$f"; done
            sed -i 's/\.gz//g' unity/Builds/WebGL/index.html
            ls -la unity/Builds/WebGL/
          fi
          echo "webgl_exit=$docker_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Zip WebGL build
        if: steps.webgl.outputs.webgl_exit == '0'
        run: |
          cd unity/Builds/WebGL
          zip -rq "$GITHUB_WORKSPACE/lilfoots-webgl-site.zip" .
          ls -la "$GITHUB_WORKSPACE/lilfoots-webgl-site.zip"
      - name: Upload WebGL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilfoots-unity-webgl
          path: |
            lilfoots-webgl-site.zip
            unity-webgl.log
          retention-days: 14
      - name: Fail flag
        if: steps.webgl.outputs.webgl_exit != '0'
        run: echo "WEBGL FAILED"; exit 1

  publish:
    name: Publish live preview (public Pages repo)
    needs: webgl
    runs-on: ubuntu-latest
    if: needs.webgl.result == 'success'
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      URL: "https://mcontwitter-glitch.github.io/lil-foots-live/"
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: lilfoots-unity-webgl
      - name: Push build to the live repo
        env:
          GTOK: ${{ inputs.gtok }}
        run: |
          rm -rf site && mkdir -p site
          unzip -q lilfoots-webgl-site.zip -d site
          ls site
          cd site
          git init -q
          git config user.name "Lil Foots Forge"
          git config user.email "forge@bigfoot404.biz"
          git checkout -q -b main
          git add -A
          git commit -qm "Lil Foots live preview update (forge run)"
          git push -q -f "https://x-access-token:${GTOK}@github.com/mcontwitter-glitch/lil-foots-live.git" main
      - name: Wait for Pages build
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Pages not 200 yet after 5 min"; exit 1
      - name: Relay live link to Bude
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" \
            -F "chat_id=${BIG_CHAT}" \
            -F "text=LIVE PREVIEW LINK: ${URL} — the actual Unity build of Lil Foots in your browser. Open it in CHROME, not the Telegram browser (Telegram's built-in browser blocks WebGL). It auto-updates every forge pass. NEW: on-screen LEFT/RIGHT/JUMP buttons — it's actually playable now (also works with a mouse)." || true
