name: Lil Foots Unity Forge

# Lil Foots: Big Adventure — the real Unity build (Bude's call, Sept 18 2026: "begin making it in unity").
# Host-runner + docker-run pattern: GitHub's runner disk cannot fit the unityci image pulled as a
# job container (both Sept 18 runs died: "no space left on device"). We free ~25GB first, then pull
# and run the image manually. QC_OUT pins shot output to <workspace>/unity/QCShots.
# Sept 18: added parallel webgl job + Pages publish — Bude's live remote link to watch the game.
on:
  workflow_dispatch:
    inputs:
      btok:
        description: 'Telegram bot token'
        required: true
      uuser:
        description: 'Unity account email'
        required: true
      upass:
        description: 'Unity account password'
        required: true
      gtok:
        description: 'Token to push the WebGL build to the live repo (mcontwitter-glitch/lil-foots-v2-live)'
        required: true
      map_scene:
        description: 'Scene to build (default Map001) - e.g. Map011 for 1-1 Meadow Run'
        required: false
      map_data:
        description: 'Level data file (default map_region1_spine.json)'
        required: false
      layers:
        description: 'Layer-by-layer review mode: build only the first N map layers (99 = full map)'
        required: false
        default: '99'
      ui:
        description: 'UI pass mode: build only character menu + controls + hearts (no world)'
        required: false
        default: ''
      idle:
        description: 'Idle pose shot: Lily in her natural select-card stance with the native skeleton'
        required: false
        default: ''
      rig:
        description: 'Rig pass mode: rig Lily/Buddy/Emma with native Unity 2D Animation + idle/walk clips'
        required: false
        default: ''
      ship:
        description: 'New playable content ready for Bude (1 = DM the build link, 0 = silent internal pass)'
        required: false
        default: '0'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    name: Map lint (fast physics/reachability fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Lint the map data (exit 1 = broken geometry, no 25-min build)
        run: |
          MAP="${{ github.event.inputs.map_data || 'map_region1_spine.json' }}"
          if [ -f "unity/Assets/LevelData/$MAP" ]; then
            python3 tools/map_lint.py "unity/Assets/LevelData/$MAP"
          else
            echo "map file unity/Assets/LevelData/$MAP not found - linting default spine map"
            python3 tools/map_lint.py unity/Assets/LevelData/map_region1_spine.json
          fi

  build:
    name: Build map 001 + QC shots + APK
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      UIMG: unityci/editor:ubuntu-2022.3.50f1-android-3.2.2
      LAYERS: ${{ inputs.layers || '99' }}
      LILFOOTS_LAYERS: ${{ inputs.layers || '99' }}
      LILFOOTS_UI: ${{ inputs.ui }}
      RIG: ${{ inputs.rig }}
      IDLE: ${{ inputs.idle }}
      SHIP: ${{ inputs.ship || '0' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_STAMP: run-${{ github.run_number }}
      MAP_SCENE: ${{ inputs.map_scene || 'Map001' }}
      MAP_DATA: ${{ inputs.map_data || 'map_region1_spine.json' }}
      LILFOOTS_TILEMAP: 1
    steps:
      - name: Free disk for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/bin/terraform /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: Pull Unity image
        run: docker pull "$UIMG"
      - name: License + build scene + art pass + QC shots
        id: forge
        run: |
          set +e
          echo "::add-mask::${{ inputs.upass }}"
          echo "::add-mask::${{ inputs.uuser }}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e QC_OUT=/project/unity/QCShots -e APK_OUT=/project/unity/Builds/LilFoots.apk \
            -e UUSER="${{ inputs.uuser }}" -e UPASS="${{ inputs.upass }}" -e LAYERS -e LILFOOTS_LAYERS -e LILFOOTS_UI -e RIG -e LILFOOTS_TILEMAP -e MAP_SCENE -e MAP_DATA -e BUILD_SHA -e BUILD_STAMP \
            "$UIMG" bash -c '
              LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
              if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
              "$LIC" --activate-all --include-personal --username "$UUSER" --password "$UPASS" > /tmp/act.log 2>&1 || true
              if ! grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log; then echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 10; fi
              echo "LICENSE OK"
              mkdir -p /project/unity/QCShots
              METHOD="LilFoots.EditorTools.LilFootsBuildRunner.BuildAndShipApk"
              if [ "$LILFOOTS_UI" = "1" ]; then
                METHOD="LilFoots.EditorTools.LilFootsArtPass.BuildAndShoot"
              fi
              if [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ]; then
                METHOD="LilFoots.EditorTools.LilFootsArtPass.BuildAndShoot"
              fi
              if [ "$RIG" = "1" ]; then
                METHOD="LilFoots.EditorTools.RigPass.BuildAndShoot"
              fi
              if [ "$IDLE" = "1" ]; then
                METHOD="LilFoots.EditorTools.RigPass.IdleShoot"
              fi
              echo "FORGE METHOD: $METHOD (LAYERS=$LAYERS)"
              xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit \
                -logFile /project/unity-forge.log -projectPath /project/unity \
                -executeMethod "$METHOD"
            '
          echo "forge_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Relay QC shots to Bude
        if: always()
        run: |
          FX="${{ steps.forge.outputs.forge_exit }}"
          # GATE 2 (LIL-FOOTS-2.0-PLAN.md): smoke RED (FX=2) = machine play-test failed = Bude never sees it.
          if [ "$FX" = "2" ]; then echo "SMOKE RED - build withheld from Bude (see smoke-report.json artifact + unity-forge.log)"; exit 0; fi
          # ART-FATIGUE RULE (Bude, Sept 19: "stop sending any more updates and art unless its the new stuff"):
          # a standard pass DMs Bude ONLY when ship=1 (new playable content). Everything else is silent —
          # shots, APK and live link land in the run artifact + Pages update, no Telegram noise.
          if [ "$SHIP" != "1" ] && [ "$RIG" != "1" ] && [ "$IDLE" != "1" ] && [ "$LILFOOTS_UI" != "1" ]; then
            echo "SILENT PASS - no DMs (ship=$SHIP). Artifacts + live link updated only."
            exit 0
          fi
          PRE="LIL FOOTS UNITY PASS 1"
          if [ "$LAYERS" = "3" ]; then PRE="MAP REBUILD - ALL 3 LAYERS (fix plan executed: organic seams, baked atmosphere, foreground props, HQ Lily)"; fi
          if [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ] && [ "$LAYERS" != "3" ]; then PRE="MAP REBUILD - LAYER $LAYERS of 3 (3-layer doctrine: 1=static vista, 2=gameplay plane, 3=foreground props; layers above $LAYERS intentionally absent)"; fi
          if [ "$LILFOOTS_UI" = "1" ]; then PRE="UI PASS - CHARACTER MENU / CONTROLS / HEARTS (HQ style, no world layers in this build)"; fi
          if [ "$RIG" = "1" ]; then PRE="ANIMATION PASS"; fi
          if [ "$IDLE" = "1" ]; then PRE="LILY IDLE POSE"; fi
          CAP1="$PRE — Map 001 start. FX=$FX"
          CAP2="$PRE — mid-map. FX=$FX"
          CAP3="$PRE — finish. FX=$FX"
          # Bude (Sept 18): "stop sending me 3 lol only need 1" -> layer reviews send ONE shot.
          if [ "$LILFOOTS_UI" = "1" ]; then
            for i in 1 2; do
              case $i in
                1) F=ui_menu.png; C="$PRE — character menu, pick your Lil Foot. FX=$FX";;
                2) F=ui_hud.png; C="$PRE — hearts, token counter, LEFT/RIGHT/JUMP buttons. FX=$FX";;
              esac
              P="unity/QCShots/$F"
              if [ -f "$P" ]; then
                curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${C}" || true
              fi
            done
          elif [ "$IDLE" = "1" ]; then
            P="unity/QCShots/idle_lily.png"
            C="$PRE - Lily in her character-select idle stance, native Unity skeleton posed mid-breath. FX=$FX"
            if [ -f "$P" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${C}" || true
            fi
          elif [ "$RIG" = "1" ]; then
            pip install --quiet pillow >/dev/null 2>&1 || pip3 install --quiet pillow >/dev/null 2>&1 || true
            python3 - <<'PYEOF' || python3 -c "print('composite skipped')"
                      from PIL import Image
                      import os
                      panels = ["rig_bindpose.png","rig_idle.png","rig_walk_native.png","rig_walk_bones.png"]
                      imgs = [Image.open("unity/QCShots/"+f) for f in panels if os.path.exists("unity/QCShots/"+f)]
                      h = min(i.height for i in imgs)
                      imgs = [i.resize((int(i.width*h/i.height), h)) for i in imgs]
                      W = sum(i.width for i in imgs)
                      sheet = Image.new("RGB",(W,h),(10,12,16))
                      x = 0
                      for i in imgs:
                          sheet.paste(i,(x,0)); x += i.width
                      sheet.save("unity/QCShots/rig_sheet.png")
                      print("rig_sheet.png:", sheet.size)
          PYEOF
            P="unity/QCShots/rig_sheet.png"
            C="$PRE — RIG PASS 1: Lily/Buddy/Emma rigged with NATIVE Unity 2D Animation. Panels: bind pose / IDLE (character select) / walk clip / bone overlay. FX=$FX"
            if [ -f "$P" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${C}" || true
            fi
          elif [ "$LAYERS" != "99" ] && [ -n "$LAYERS" ]; then
            P="unity/QCShots/unity_start.png"
            if [ -f "$P" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendPhoto" -F "chat_id=${BIG_CHAT}" -F "photo=@$P" -F "caption=${CAP1}" || true
            fi
          else
            # NO QC SHOT DMs (art-fatigue rule). A shipped build DMs the playable link only.
            if [ "$FX" = "0" ]; then
              SMOKE=$(grep -o '"passed": [0-9]*' smoke-report.json 2>/dev/null | grep -o '[0-9]*' || true)
              # [SHIP-PURITY Sept 27 PM - BudE: 'only send fixed updated versions'] this job
              # must NEVER DM the live link: it fires before the webgl build exists, which is
              # exactly how stale-map DMs went out. The ONLY link DM is the publish job, sent
              # after the fresh artifact is published and Pages serves HTTP 200, with identity.
              if false; then
                curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" -F "chat_id=${BIG_CHAT}" \
                  -F "text=New playable build is live: https://mcontwitter-glitch.github.io/lil-foots-v2-live/ (Chrome on desktop/Android). Machine play-test green: ${SMOKE:-all} checks passed." || true
              fi
            fi
          fi
          if [ -f "unity/Builds/LilFoots.apk" ]; then
            SZ=$(stat -c%s "unity/Builds/LilFoots.apk")
            echo "apk size: $SZ"
            if [ "$SZ" -lt 49000000 ]; then
              curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendDocument" \
                -F "chat_id=${BIG_CHAT}" \
                -F "document=@unity/Builds/LilFoots.apk" \
                -F "caption=New playable APK build of Lil Foots — after download: allow installs from unknown sources, then open the file." || true
            else
              echo "APK over Telegram's 50MB send cap - direct download URL gets DM'd by the release step below."
            fi
          fi
          # No failure DM to Bude (his call: only send the new stuff). Failures watched internally.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilfoots-unity-forge
          path: |
            unity/Assets/Scenes/**
            unity/QCShots/**
            unity/Builds/**
            unity/smoke-report.json
            smoke-report.json
            unity-forge.log
          retention-days: 14
      # [Sept 27 - BudE: "How do we make so downloadable if hitting the telegram send cap?"]
      # Big APKs bypass Telegram's 50MB send cap entirely: the APK is published as a
      # release asset on the PUBLIC live repo (2GB ceiling) and Bude gets the direct
      # browser-download URL - no GitHub login, no artifacts page, no cap.
      - name: Publish downloadable APK (Telegram cap bypass)
        if: ${{ inputs.ship == '1' && hashFiles('unity/Builds/LilFoots.apk') != '' }}
        env:
          GTOK: ${{ inputs.gtok }}
          BIG_CHAT: "7257834686"
          BTOK: ${{ inputs.btok }}
        run: |
          APK="unity/Builds/LilFoots.apk"
          if [ ! -f "$APK" ]; then echo "no APK this run"; exit 0; fi
          export GH_TOKEN="$GTOK"
          LIVE_REPO="mcontwitter-glitch/lil-foots-v2-live"
          # refresh the stable apk-latest release (same tag every build -> same URL every time)
          gh release delete apk-latest --repo "$LIVE_REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "$APK#LilFoots.apk" \
            --repo "$LIVE_REPO" \
            --title "Lil Foots — latest playable APK" \
            --notes "Auto-published latest build. Download LilFoots.apk, allow installs from unknown sources, then open the file."
          URL=$(gh release view apk-latest --repo "$LIVE_REPO" --json assets --jq '.assets[0].browser_download_url')
          echo "APK direct URL: $URL"
          SZ=$(stat -c%s "$APK")
          if [ "$SZ" -ge 49000000 ]; then
            curl -s -X POST "https://api.telegram.org/bot${BTOK}/sendMessage" \
              -F "chat_id=${BIG_CHAT}" \
              -F "text=Lil Foots APK is over Telegram's 50MB send cap, so here's the direct download: ${URL} — after download: allow installs from unknown sources, then open the file." || true
          fi

      - name: Fail flag
        if: steps.forge.outputs.forge_exit != '0'
        run: echo "FORGE FAILED"; exit 1

  webgl:
    name: Build WebGL (live web preview for Bude)
    needs: lint
    # Bude (Sept 18 ~11:54 PM ET): "this link the game was still incorrect lets make sure its right
    # before you build" -> NO live-link publishes while a review is open (layer QC or UI QC).
    # The link only updates once the map layers are approved; reviews go shot-by-shot via DM.
    if: ${{ (!inputs.layers || inputs.layers == '99') && inputs.ui != '1' && inputs.rig != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      UIMG: unityci/editor:ubuntu-2022.3.50f1-webgl-3.2.2
      # [LIVE-LINK MAP FIX Sept 27] ROOT CAUSE of 'the map hadn't changed at all from the
      # others' (BudE): this job's env never received map_scene/map_data/tilemap from the
      # dispatch inputs, so EVERY live-link build silently fell back to the default map in
      # legacy (non-tilemap) mode while the QC/APK job built the real course. The live
      # game was always one whole map behind what the shots showed.
      LILFOOTS_TILEMAP: 1
      MAP_SCENE: ${{ inputs.map_scene || 'Map001' }}
      MAP_DATA: ${{ inputs.map_data || 'map_region1_spine.json' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_STAMP: run-${{ github.run_number }}
    steps:
      - name: Free disk for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/bin/terraform /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - name: Pull Unity image
        run: docker pull "$UIMG"
      - name: License + WebGL build
        id: webgl
        run: |
          set +e
          echo "::add-mask::${{ inputs.upass }}"
          echo "::add-mask::${{ inputs.uuser }}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e QC_OUT=/project/unity/QCShots -e WEBGL_OUT=/project/unity/Builds/WebGL \
            -e UUSER="${{ inputs.uuser }}" -e UPASS="${{ inputs.upass }}" -e LILFOOTS_TILEMAP -e MAP_SCENE -e MAP_DATA -e BUILD_SHA -e BUILD_STAMP \
            "$UIMG" bash -c '
              LIC=$(find /opt/unity -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
              if [ -z "$LIC" ]; then LIC=$(find /opt/unity -type f -iname "*Licensing.Client*" ! -name "*.config" ! -name "*.dll" 2>/dev/null | head -1); fi
              "$LIC" --activate-all --include-personal --username "$UUSER" --password "$UPASS" > /tmp/act.log 2>&1 || true
              if ! grep -qiE "ASSIGN_SEAT|successfully" /tmp/act.log; then echo "LICENSE FAILED"; head -20 /tmp/act.log; exit 10; fi
              echo "LICENSE OK"
              mkdir -p /project/unity/QCShots
              xvfb-run -a /opt/unity/Editor/Unity -batchmode -quit \
                -logFile /project/unity-webgl.log -projectPath /project/unity \
                -executeMethod LilFoots.EditorTools.LilFootsBuildRunner.BuildAndShipWebGl
            '
          docker_rc=$?
          # Pages safety net: if Unity still emitted .gz files, strip them for raw static hosting
          if [ -d unity/Builds/WebGL ] && ls unity/Builds/WebGL/*.gz >/dev/null 2>&1; then
            echo "GZ files present — decompressing for static hosting"
            for f in unity/Builds/WebGL/*.gz; do gunzip -f "$f"; done
            sed -i 's/\.gz//g' unity/Builds/WebGL/index.html
            ls -la unity/Builds/WebGL/
          fi
          echo "webgl_exit=$docker_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Zip WebGL build
        if: steps.webgl.outputs.webgl_exit == '0'
        run: |
          cd unity/Builds/WebGL
          zip -rq "$GITHUB_WORKSPACE/lilfoots-webgl-site.zip" .
          ls -la "$GITHUB_WORKSPACE/lilfoots-webgl-site.zip"
      - name: Upload WebGL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilfoots-unity-webgl
          path: |
            lilfoots-webgl-site.zip
            unity-webgl.log
          retention-days: 14
      - name: Fail flag
        if: steps.webgl.outputs.webgl_exit != '0'
        run: echo "WEBGL FAILED"; exit 1

  publish:
    name: Publish live preview (public Pages repo)
    needs: webgl
    runs-on: ubuntu-latest
    if: needs.webgl.result == 'success'
    env:
      BIG_CHAT: "7257834686"
      BTOK: ${{ inputs.btok }}
      URL: "https://mcontwitter-glitch.github.io/lil-foots-v2-live/"
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: lilfoots-unity-webgl
      - name: Push build to the live repo
        env:
          GTOK: ${{ inputs.gtok }}
        run: |
          rm -rf site && mkdir -p site
          unzip -q lilfoots-webgl-site.zip -d site
          ls site
          # [SHIP-PURITY Sept 27 PM] the published site states exactly what build it is
          echo "lil-foots build ${{ github.sha }} (run-${{ github.run_number }}) map=${{ inputs.map_data || 'map_region1_spine.json' }}" > site/version.txt
          # ---- WEBGL PHONE INPUT FIX (Sept 20, Bude: jump button dead + stuck on select):
          # phone browsers claim canvas touches for scroll/pull-to-refresh, which kills
          # Unity's uGUI pointer events (touch deck AND character select go dead).
          # Inject CSS touch-action:none + JS preventDefault into the shipped site. ----
          printf '\n/* WEBGL PHONE INPUT FIX: browser must never claim canvas touches */\nhtml, body { overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }\n#unity-canvas { touch-action: none; }\n' >> site/TemplateData/style.css
          sed -i 's|loadingBar.style.display = "block";|canvas.addEventListener("touchstart", function(e){ e.preventDefault(); }, { passive: false });\n          canvas.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive: false });\n\n          loadingBar.style.display = "block";|' site/index.html
          grep -c "touch-action" site/TemplateData/style.css || true
          # ---- CACHE-BUST (Sept 20, Bude: 'same old map' — phone browsers were serving
          # the cached previous build from identical asset URLs; stale HTML references
          # must be impossible). Stamp a unique version on every asset URL. ----
          STAMP="${GITHUB_RUN_ID}-$(date +%s)"
          sed -i "s|/WebGL.data.unityweb|/WebGL.data.unityweb?v=${STAMP}|; s|/WebGL.framework.js.unityweb|/WebGL.framework.js.unityweb?v=${STAMP}|; s|/WebGL.wasm.unityweb|/WebGL.wasm.unityweb?v=${STAMP}|" site/index.html
          grep -o "unityweb?v=[^\"']*" site/index.html | head -3
          cd site
          git init -q
          git config user.name "Lil Foots Forge"
          git config user.email "forge@bigfoot404.biz"
          git checkout -q -b main
          git add -A
          git commit -qm "Lil Foots live preview update (forge run)"
          git push -q -f "https://x-access-token:${GTOK}@github.com/mcontwitter-glitch/lil-foots-v2-live.git" main
      - name: Wait for Pages build
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Pages not 200 yet after 5 min"; exit 1
      - name: Playtest gate — NO auto DM
        if: success() && inputs.ship == '1'
        # [PLAYTEST GATE Sept 27 PM] BudE: "before you send me a link to play it do a play
        # test your self if you can" — after hitting invisible walls and invisible ground.
        # This step used to DM the link the moment Pages served 200. It no longer DMs at
        # all: the agent loads the live build in a real browser, runs/jumps/hits blocks,
        # verifies the geometry gate report AND the live build, and only then DMs the link
        # with the playtest verdict. A build can publish to the site silently (ship=1
        # included) and the DM only goes out after the agent's playtest passes.
        run: |
          echo "PLAYTEST PENDING — build ${{ github.sha }} (run-${{ github.run_number }}), map ${{ inputs.map_data || 'map_region1_spine.json' }} published. Agent playtests https://mcontwitter-glitch.github.io/lil-foots-v2-live/ before any DM."
